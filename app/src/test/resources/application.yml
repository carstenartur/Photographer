# Test overrides — enable mock camera for integration tests
camera:
  mock:
    enabled: true

focusstack:
  storage:
    images-dir: ${java.io.tmpdir}/focusstack-test-images

# Use in-memory Lucene indexes in tests to avoid file-system write.lock
# contention between Spring contexts that run in the same JVM
spring:
  jpa:
    properties:
      hibernate:
        search:
          backend:
            directory:
              type: local-heap
