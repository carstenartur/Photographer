spring:
  config:
    # Runtime-only secret files are mounted below this directory. The import is
    # optional so deployments without CCAPI credentials remain unchanged.
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/focusstack}
    username: ${SPRING_DATASOURCE_USERNAME:focusstack}
    password: ${SPRING_DATASOURCE_PASSWORD:focusstack}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        search:
          backend:
            type: lucene
            directory:
              type: local-filesystem
              # Configure this path via env var and mount it to persistent storage in Docker/Kubernetes.
              root: ${HIBERNATE_SEARCH_INDEX_ROOT:/app/data/search-index}

focusstack:
  storage:
    images-dir: ${FOCUSSTACK_STORAGE_IMAGES_DIR:/app/images}
    search-index-dir: ${FOCUSSTACK_STORAGE_SEARCH_INDEX_DIR:/app/data/search-index}

camera:
  mock:
    enabled: ${CAMERA_MOCK_ENABLED:false}

logging:
  level:
    root: INFO
    com.photographer.focusstack: DEBUG
