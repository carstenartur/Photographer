server:
  port: 8080

spring:
  application:
    name: focusstack
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:focusstack
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        search:
          backend:
            type: lucene
            directory:
              type: local-heap
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

camera:
  mock:
    enabled: false
    delay-ms: 50
    # Failure simulation (0 = disabled):
    simulate-timeout-after-frames: 0      # block for 30 s after N captures
    simulate-disconnect-after-frames: 0   # throw after N captures
    simulate-empty-frame-at: 0            # return empty image at capture N
    simulate-movement-at: 0              # return movement-like image at capture N
  ccapi:
    base-url: http://192.168.1.2:8080
  focus:
    # Step strategy: 'adaptive' (gradient-based narrowing) or 'linear' (fixed steps)
    step-strategy: adaptive

analysis:
  motion:
    # Motion detection strategy: 'optical-flow' (ImageJ-decoded pixel diff, accurate)
    # or 'pixel-diff' (raw byte comparison, faster but less accurate for compressed images)
    strategy: optical-flow

focusstack:
  security:
    # Change this via environment variable FOCUSSTACK_SECURITY_ADMIN_PASSWORD in production
    admin-password: ${FOCUSSTACK_SECURITY_ADMIN_PASSWORD:focusstack}
  storage:
    images-dir: ${FOCUSSTACK_STORAGE_IMAGES_DIR:./data/images}
    search-index-dir: ${FOCUSSTACK_STORAGE_SEARCH_INDEX_DIR:./data/search-index}
    max-disk-usage-bytes: ${FOCUSSTACK_STORAGE_MAX_DISK_USAGE_BYTES:10737418240}
  camera:
    ccapi-base-url: ${FOCUSSTACK_CAMERA_CCAPI_BASE_URL:http://192.168.1.2:8080}
    mock-enabled: ${FOCUSSTACK_CAMERA_MOCK_ENABLED:false}
    connection-timeout: ${FOCUSSTACK_CAMERA_CONNECTION_TIMEOUT:10s}
  plugins:
    directory: ${FOCUSSTACK_PLUGINS_DIR:./plugins}
    enabled: ${FOCUSSTACK_PLUGINS_ENABLED:true}
  retention:
    enabled: ${FOCUSSTACK_RETENTION_ENABLED:false}
    jobs-max-age-days: ${FOCUSSTACK_RETENTION_JOBS_MAX_AGE_DAYS:0}
    events-max-age-days: ${FOCUSSTACK_RETENTION_EVENTS_MAX_AGE_DAYS:0}
    astro-max-age-days: ${FOCUSSTACK_RETENTION_ASTRO_MAX_AGE_DAYS:0}
    cron: ${FOCUSSTACK_RETENTION_CRON:0 0 3 * * *}

logging:
  level:
    root: INFO
    com.photographer.focusstack: INFO
    org.springframework.security: WARN

# Wildlife Observer configuration
observer:
  enabled: ${OBSERVER_ENABLED:false}
  default-profile: ${OBSERVER_DEFAULT_PROFILE:birdhouse}
  preferred-ai-provider: ${OBSERVER_AI_PROVIDER:mock}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${OBSERVER_GEMINI_MODEL:gemini-2.5-flash}
    endpoint: ${OBSERVER_GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-seconds: ${OBSERVER_GEMINI_TIMEOUT:30}
  folder:
    enabled: ${OBSERVER_FOLDER_ENABLED:false}
    path: ${OBSERVER_FOLDER_PATH:./data/observer-images}
