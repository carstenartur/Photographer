spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/focusstack
    username: ${POSTGRES_USER:focusstack}
    password: ${POSTGRES_PASSWORD:focusstack}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
