server:
  port: 8080

spring:
  application:
    name: camera-service
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:focusstack
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        search:
          backend:
            type: lucene
            directory:
              type: local-heap

camera:
  mock:
    enabled: true
    delay-ms: 50
    # Failure simulation (0 = disabled):
    simulate-timeout-after-frames: 0      # block for 30 s after N captures
    simulate-disconnect-after-frames: 0   # throw after N captures
    simulate-empty-frame-at: 0            # return empty image at capture N
    simulate-movement-at: 0               # return movement-like image at capture N
  ccapi:
    base-url: http://192.168.1.2:8080
  focus:
    # Step strategy: 'adaptive' (gradient-based narrowing) or 'linear' (fixed steps)
    step-strategy: adaptive

analysis:
  service:
    # Set to true and provide the URL to enable live per-frame analysis.
    # When disabled, camera-service runs in linear mode without analysis feedback.
    enabled: false
    url: http://analysis-service:8081

logging:
  level:
    root: INFO
    com.photographer.focusstack.camera: DEBUG
