server:
  port: 8081

spring:
  application:
    name: analysis-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

analysis:
  motion:
    # Motion detection strategy: 'optical-flow' (ImageJ-decoded pixel diff, accurate)
    # or 'pixel-diff' (raw byte comparison, faster but less accurate for compressed images)
    strategy: optical-flow

logging:
  level:
    root: INFO
    com.photographer.focusstack.analysis: DEBUG
