services:
  focusstack:
    environment:
      # Comma-separated profile ids that must have complete runtime credentials.
      # Startup fails with a count-only, secret-free error when binding is absent.
      FOCUSSTACK_CAMERA_CCAPI_RUNTIME_REQUIRED_PROFILE_IDS: ${CCAPI_REQUIRED_PROFILE_IDS:-camera-smoke}
    secrets:
      - source: ccapi_camera_username
        target: focusstack.camera.ccapi.credentials.camera-smoke.username
      - source: ccapi_camera_password
        target: focusstack.camera.ccapi.credentials.camera-smoke.password

secrets:
  ccapi_camera_username:
    file: ${CCAPI_CAMERA_USERNAME_FILE:?Set CCAPI_CAMERA_USERNAME_FILE to a local secret file}
  ccapi_camera_password:
    file: ${CCAPI_CAMERA_PASSWORD_FILE:?Set CCAPI_CAMERA_PASSWORD_FILE to a local secret file}
