services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focusstack}
      POSTGRES_USER: ${POSTGRES_USER:-focusstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focusstack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - focusstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focusstack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  focusstack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-focusstack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-focusstack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-focusstack}
      CAMERA_MOCK_ENABLED: ${CAMERA_MOCK_ENABLED:-true}
      CAMERA_CCAPI_BASE_URL: ${CAMERA_CCAPI_BASE_URL:-http://192.168.1.2:8080}
      FOCUSSTACK_SECURITY_ADMIN_PASSWORD: ${FOCUSSTACK_SECURITY_ADMIN_PASSWORD:-changeme}
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
    volumes:
      - image-storage:/app/data/images
      - search-index:/app/data/search-index
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - focusstack
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/analysis/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  image-storage:
  search-index:

networks:
  focusstack:
    driver: bridge
