<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
      }
      header {
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        color: #000;
      }
      button {
        color: #fff;
        background-color: #3298dc;
        border-color: transparent;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background-color: #2793da;
        flex: none;
      }
      .spacer {
        flex: auto;
      }
      .small {
        font-size: 0.75rem;
      }
      footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
      }
      .header-label {
        margin-right: 4px;
      }
      .benchmark-set {
        margin: 8px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .benchmark-title {
        font-size: 3rem;
        font-weight: 600;
        word-break: break-word;
        text-align: center;
      }
      .benchmark-graphs {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 1.5rem;
        width: 100%;
      }
      .benchmark-graph {
        flex: 1 1 30rem;
        min-width: 0;
        max-width: 1000px;
        margin: 0;
      }
      .benchmark-history, .benchmark-implementation {
        display: block;
        font-size: 0.875rem;
        margin: 0.25rem 0;
      }
      .benchmark-implementation {
        border-left: 0.25rem solid;
        padding-left: 0.5rem;
      }
      .benchmark-chart-container {
        position: relative;
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
      <p>Native CRX decoding entered this history on 14 November 2026. Earlier RAW decoder measurements used experimental reconstruction.</p>
    </header>
    <main id="main"></main>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
    <script src="data.js"></script>
    <script src="labels.js?v=2"></script>
    <script id="main-script">
      'use strict';
      (function() {
        // Colors from https://github.com/github/linguist/blob/master/lib/linguist/languages.yml
        const toolColors = {
          cargo: '#dea584',
          go: '#00add8',
          benchmarkjs: '#f1e05a',
          benchmarkluau: '#000080',
          pytest: '#3572a5',
          googlecpp: '#f34b7d',
          catch2: '#f34b7d',
          julia: '#a270ba',
          jmh: '#b07219',
          benchmarkdotnet: '#178600',
          customBiggerIsBetter: '#38ff38',
          customSmallerIsBetter: '#ff3838',
          _: '#333333'
        };
        const implementationColors = ['#21657c', '#6754a3', '#316942'];
        const dayInMs = 24 * 60 * 60 * 1000;
        const dateFormat = new Intl.DateTimeFormat('en-GB', {
          day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC',
        });
        const shortDateFormat = new Intl.DateTimeFormat('en-GB', {
          day: 'numeric', month: 'short', timeZone: 'UTC',
        });
        const timeFormat = new Intl.DateTimeFormat('en-GB', {
          day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC',
        });

        function collectBenchmarks(entries) {
          const charts = new Map();
          for (const { commit, date, tool, benches } of entries.slice().sort((a, b) => a.date - b.date)) {
            for (const bench of benches) {
              const { label, implementation } = window.CR3_BENCHMARK_LABELS?.describe?.(bench.name, commit)
                ?? { label: bench.name, implementation: '' };
              const key = JSON.stringify([label, bench.unit]);
              if (!charts.has(key)) {
                charts.set(key, { label, unit: bench.unit, tool, implementations: new Map() });
              }
              const implementations = charts.get(key).implementations;
              if (!implementations.has(implementation)) {
                implementations.set(implementation, []);
              }
              implementations.get(implementation).push({ commit, date, bench });
            }
          }
          return charts.values();
        }

        function init() {
          const data = window.BENCHMARK_DATA;

          // Render header
          document.getElementById('last-update').textContent = new Date(data.lastUpdate).toString();
          const repoLink = document.getElementById('repository-link');
          repoLink.href = data.repoUrl;
          repoLink.textContent = data.repoUrl;

          // Render footer
          document.getElementById('dl-button').onclick = () => {
            const file = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const dataUrl = URL.createObjectURL(file);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'benchmark_data.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(dataUrl), 0);
          };

          // Prepare data points for charts
          return Object.keys(data.entries).map(name => ({
            name,
            benchmarks: collectBenchmarks(data.entries[name]),
          }));
        }

        function runRange(count, start, end) {
          const first = dateFormat.format(start);
          const last = dateFormat.format(end);
          const range = first === last ? first : first + ' – ' + last;
          return count + (count === 1 ? ' run · ' : ' runs · ') + range + ' (UTC)';
        }

        function renderGraph(parent, { label, unit, tool, implementations }) {
          const series = Array.from(implementations, ([name, runs], index) => ({
            name,
            runs,
            color: index === 0
              ? toolColors[tool] || toolColors._
              : implementationColors[(index - 1) % implementationColors.length],
          }));
          const start = Math.min(...series.map(({ runs }) => runs[0].date));
          const end = Math.max(...series.map(({ runs }) => runs[runs.length - 1].date));
          const count = series.reduce((total, { runs }) => total + runs.length, 0);

          const figure = document.createElement('figure');
          figure.className = 'benchmark-graph';
          parent.appendChild(figure);
          const caption = document.createElement('figcaption');
          figure.appendChild(caption);
          const heading = document.createElement('strong');
          heading.textContent = label;
          caption.appendChild(heading);
          const history = document.createElement('span');
          history.className = 'benchmark-history';
          history.textContent = runRange(count, start, end);
          caption.appendChild(history);
          for (const { name, runs, color } of series) {
            if (name) {
              const summary = document.createElement('span');
              summary.className = 'benchmark-implementation';
              summary.textContent = name + ' · ' + runRange(runs.length, runs[0].date, runs[runs.length - 1].date);
              summary.style.borderLeftColor = color;
              caption.appendChild(summary);
            }
          }

          const container = document.createElement('div');
          container.className = 'benchmark-chart-container';
          figure.appendChild(container);
          const canvas = document.createElement('canvas');
          canvas.setAttribute('role', 'img');
          canvas.setAttribute('aria-label', label + ', ' + history.textContent);
          container.appendChild(canvas);

          const getRun = ({ datasetIndex, index }) => series[datasetIndex].runs[index];
          const xTicks = {
            maxTicksLimit: 5,
            callback: value => (end - start <= 3 * dayInMs ? timeFormat : shortDateFormat).format(value),
          };
          if (start === end) {
            const halfHour = 30 * 60 * 1000;
            xTicks.min = start - halfHour;
            xTicks.max = end + halfHour;
          }

          new Chart(canvas, {
            type: 'line',
            data: {
              datasets: series.map(({ name, runs, color }) => ({
                label: name || label,
                data: runs.map(({ date, bench }) => ({ x: date, y: bench.value })),
                borderColor: color,
                backgroundColor: color,
                borderWidth: 2,
                fill: false,
                lineTension: 0,
              })),
            },
            options: {
              legend: { display: false },
              scales: {
                xAxes: [{
                  type: 'linear',
                  position: 'bottom',
                  scaleLabel: {
                    display: true,
                    labelString: 'Run recorded (UTC)',
                  },
                  ticks: xTicks,
                }],
                yAxes: [{
                  scaleLabel: {
                    display: true,
                    labelString: unit,
                  },
                  ticks: {
                    beginAtZero: true,
                  }
                }],
              },
              tooltips: {
                callbacks: {
                  title: items => {
                    const { date } = getRun(items[0]);
                    return 'Run recorded ' + new Date(date).toISOString().replace('T', ' ').replace('Z', ' UTC');
                  },
                  afterTitle: items => {
                    const { commit } = getRun(items[0]);
                    return '\n' + commit.id.slice(0, 7) + ' · ' + commit.message
                      + '\n\nCommitted ' + commit.timestamp + ' by @' + commit.committer.username + '\n';
                  },
                  label: item => {
                    const { value, range } = getRun(item).bench;
                    return value + ' ' + unit + (range ? ' (' + range + ')' : '');
                  },
                  afterLabel: item => {
                    const { extra } = getRun(item).bench;
                    return extra ? '\n' + extra : '';
                  }
                }
              },
              onClick: (_mouseEvent, activeElems) => {
                if (activeElems.length === 0) {
                  return;
                }
                const { _datasetIndex, _index } = activeElems[0];
                const { commit } = getRun({ datasetIndex: _datasetIndex, index: _index });
                window.open(commit.url, '_blank', 'noopener');
              },
            },
          });
        }

        function renderBenchSet(name, benchmarks, main) {
          const setElem = document.createElement('div');
          setElem.className = 'benchmark-set';
          main.appendChild(setElem);

          const nameElem = document.createElement('h1');
          nameElem.className = 'benchmark-title';
          nameElem.textContent = name;
          setElem.appendChild(nameElem);

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs';
          setElem.appendChild(graphsElem);

          for (const benchmark of benchmarks) {
            renderGraph(graphsElem, benchmark);
          }
        }

        const main = document.getElementById('main');
        for (const { name, benchmarks } of init()) {
          renderBenchSet(name, benchmarks, main);
        }
      })();
    </script>
  </body>
</html>
