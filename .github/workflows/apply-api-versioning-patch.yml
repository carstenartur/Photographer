name: Apply API versioning patch

on:
  push:
    branches:
      - feature/api-v1-compatibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/api-v1-compatibility
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/api-versioning.patch.gz.b64 | gzip --decompress > /tmp/api-versioning.patch
          git apply --check /tmp/api-versioning.patch

      - name: Apply implementation and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/api-versioning.patch
          rm -f .github/api-versioning.patch.gz.b64
          rm -f .github/workflows/apply-api-versioning-patch.yml
          rm -f .github/workflows/source-snapshot.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(api): add canonical v1 routes and compatibility aliases'
          git push origin HEAD:feature/api-v1-compatibility
