name: CR3 D13 Context Topology

on:
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-research/**/CrxSubbandTopology*.java'
      - 'docs/cleanroom/d13-*.md'
      - 'docs/cr3-results/*D13*.md'
      - '.github/workflows/cr3-d13-topology.yml'
  workflow_dispatch:

concurrency:
  group: cr3-d13-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  topology:
    name: D13 source and topology evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAVEN_OPTS: '-Xmx4g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Stage research dependencies
        run: >-
          mvn -B --no-transfer-progress install
          -DskipTests
          -pl canon-cr3-research
          -am
          -Djava.awt.headless=true
      - name: Run fixed-panel topology inventory
        run: >-
          mvn -B --no-transfer-progress verify
          -Pcr3-research-it
          -pl canon-cr3-research
          -am
          -Dit.test=CrxSubbandTopologyIT
          -Djava.awt.headless=true
      - name: Publish test result
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 D13 Topology Test
          path: 'canon-cr3-research/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload deterministic topology evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cr3-d13-topology-evidence
          path: |
            canon-cr3-research/target/**/results.md
            canon-cr3-research/target/**/results.tsv
            canon-cr3-research/target/**/results.json
            canon-cr3-research/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14
