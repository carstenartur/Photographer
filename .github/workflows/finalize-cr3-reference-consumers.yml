name: Finalize CR3 reference consumer migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-cr3-reference-consumers.yml'

permissions:
  contents: read

concurrency:
  group: finalize-cr3-reference-consumers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'testkit/cr3-active-consumer-migration'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xmx1g
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Merge main and migrate active consumers
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee finalize-cr3-consumers.log) 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          record_failure() {
            status=$?
            set +e
            printf 'status=failure\nsource_commit=%s\nexit_code=%s\n' "$GITHUB_SHA" "$status" \
              > finalize-cr3-consumers.status
            tail -n 320 finalize-cr3-consumers.log > finalize-cr3-consumers.diagnostics.txt
            git add finalize-cr3-consumers.status finalize-cr3-consumers.diagnostics.txt
            git commit -m 'ci(testkit): record active-consumer migration failure' || true
            git push origin HEAD:testkit/cr3-active-consumer-migration || true
            exit "$status"
          }
          trap record_failure ERR
          set -euo pipefail

          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/automation/migrate-cr3-active-consumers:refs/remotes/origin/automation/migrate-cr3-active-consumers
          git merge --no-edit origin/main
          git show origin/automation/migrate-cr3-active-consumers:scripts/migrate_cr3_active_consumers.py \
            > /tmp/migrate_cr3_active_consumers.py
          python3 /tmp/migrate_cr3_active_consumers.py

          for test_class in \
            Cr3ReferenceComparisonIT \
            PedestalHypothesisValidationIT \
            DcComponentIsolationIT
          do
            MAVEN_OPTS=-Xmx10g mvn -B --no-transfer-progress test \
              -pl canon-cr3-research -am \
              -Dtest="$test_class" \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -DforkCount=0 \
              -Djava.awt.headless=true
          done

          mvn -B --no-transfer-progress clean verify \
            -pl canon-cr3-reference-testkit,canon-cr3-research -am \
            -Djava.awt.headless=true

          rm -f finalize-cr3-consumers.status finalize-cr3-consumers.diagnostics.txt
          git rm .github/workflows/finalize-cr3-reference-consumers.yml
          git add -A
          git commit -m 'refactor(testkit): migrate active CR3 reference consumers'
          git push origin HEAD:testkit/cr3-active-consumer-migration
