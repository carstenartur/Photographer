name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - 'scripts/compare_jmh.py'
      - 'scripts/test_compare_jmh.py'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
  schedule:
    # Refresh longitudinal history weekly on the default branch.
    - cron: '30 2 * * 1'

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH Benchmarks (Canon CR3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MAVEN_OPTS: '-Xmx2g'
      JMH_OUTPUT_DIR: ${{ runner.temp }}/cr3-jmh

    steps:
      - name: Checkout repository with base and head history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Test the JMH comparator
        run: python3 scripts/test_compare_jmh.py

      - name: Record benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JMH_OUTPUT_DIR"
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "event=${{ github.event_name }}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -a)"
            echo
            echo "## CPU"
            lscpu
            echo
            echo "## Java"
            java -version 2>&1
            echo
            echo "## Maven"
            mvn -version
          } > "$JMH_OUTPUT_DIR/environment.txt"

      - name: Compare pull-request base and head on the same runner
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "run_order=base,head"
          } >> "$JMH_OUTPUT_DIR/environment.txt"

          run_revision() {
            local label="$1"
            local sha="$2"

            git reset --hard
            git clean -fdx
            git checkout --detach "$sha"
            git reset --hard "$sha"
            git clean -fdx

            mvn -B --no-transfer-progress -DskipTests \
              -P benchmarks \
              -pl canon-cr3-benchmark -am \
              package \
              -Djava.awt.headless=true

            java -Djava.awt.headless=true \
              -Dsamples.dir="$GITHUB_WORKSPACE/canon-cr3-imageio/src/test/resources/samples" \
              -jar canon-cr3-benchmark/target/benchmarks.jar \
              'com\.photographer\.focusstack\.cr3\.benchmark\.(Cr3BoxParseBenchmark|Cr3MetadataBenchmark|Cr3PreviewExtractBenchmark|CrxLosslessDecodeBenchmark)\..*' \
              -p sample=sample.cr3 \
              -wi 2 -i 3 -w 1s -r 1s -f 1 \
              -rf json \
              -rff "$JMH_OUTPUT_DIR/${label}.json"
          }

          run_revision base "$BASE_SHA"
          run_revision head "$HEAD_SHA"

          set +e
          python3 scripts/compare_jmh.py \
            "$JMH_OUTPUT_DIR/base.json" \
            "$JMH_OUTPUT_DIR/head.json" \
            --threshold 1.15 \
            --markdown-out "$JMH_OUTPUT_DIR/comparison.md" \
            --json-out "$JMH_OUTPUT_DIR/comparison.json" \
            --fail-on-regression
          comparison_status=$?
          set -e

          cat "$JMH_OUTPUT_DIR/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$comparison_status"

      - name: Upload pull-request benchmark comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cr3-jmh-pr-comparison
          path: ${{ runner.temp }}/cr3-jmh/
          if-no-files-found: error
          retention-days: 7

      - name: Build full benchmark suite
        if: github.event_name != 'pull_request'
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -P benchmarks
          -pl canon-cr3-benchmark -am
          package
          -Djava.awt.headless=true

      - name: Run full JMH benchmark suite
        if: github.event_name != 'pull_request'
        run: >-
          java -Djava.awt.headless=true
          -Dsamples.dir=$GITHUB_WORKSPACE/canon-cr3-imageio/src/test/resources/samples
          -jar canon-cr3-benchmark/target/benchmarks.jar
          -rf json
          -rff jmh-result.json

      - name: Upload raw full-suite JMH JSON
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jmh-result
          path: jmh-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload benchmark environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cr3-jmh-environment
          path: ${{ runner.temp }}/cr3-jmh/environment.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish scheduled history to gh-pages
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Canon CR3 JMH Benchmarks
          tool: jmh
          output-file-path: jmh-result.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
