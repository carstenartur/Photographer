name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH Benchmarks (Canon CR3)
    runs-on: ubuntu-latest
    permissions:
      contents: write           # github-action-benchmark needs to push to gh-pages
      deployments: write
      pull-requests: write       # to post regression comments on PRs
    env:
      MAVEN_OPTS: "-Xmx2g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build benchmarks uber-jar
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -P benchmarks
          -pl canon-cr3-benchmark -am
          package
          -Djava.awt.headless=true

      - name: Run JMH benchmarks
        run: >-
          java -Djava.awt.headless=true
          -Dsamples.dir=$GITHUB_WORKSPACE/canon-cr3-imageio/src/test/resources/samples
          -jar canon-cr3-benchmark/target/benchmarks.jar
          -rf json
          -rff jmh-result.json
