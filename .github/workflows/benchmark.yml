name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH Benchmarks (Canon CR3)
    runs-on: ubuntu-latest
    permissions:
      contents: write           # github-action-benchmark needs to push to gh-pages
      deployments: write
      pull-requests: write       # to post regression comments on PRs
    env:
      MAVEN_OPTS: "-Xmx2g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build benchmarks uber-jar
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -pl canon-cr3-benchmark -am
          package
          -Djava.awt.headless=true

      - name: Run JMH benchmarks
        run: >-
          java -Djava.awt.headless=true
          -Dsamples.dir=$GITHUB_WORKSPACE/canon-cr3-imageio/src/test/resources/samples
          -jar canon-cr3-benchmark/target/benchmarks.jar
          -rf json
          -rff jmh-result.json

      - name: Upload raw JMH JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-result
          path: jmh-result.json
          retention-days: 30

      - name: Publish results to gh-pages and alert on regression
        # Pinned to a tagged release for supply-chain safety. Renovate / Dependabot
        # may bump this in future.
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Canon CR3 JMH Benchmarks
          tool: jmh
          output-file-path: jmh-result.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push the result history to gh-pages for main pushes only — PR runs
          # only post the regression comment without polluting history.
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: true
          summary-always: true
