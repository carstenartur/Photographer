name: CR3 Research Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'

concurrency:
  group: cr3-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research-it:
    name: CR3 research integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAVEN_OPTS: '-Xmx4g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run the Maven-owned research integration profile
        run: >-
          mvn -B --no-transfer-progress clean verify
          -Pcr3-research-it
          -pl canon-cr3-research
          -am
          -Djava.awt.headless=true

      - name: Publish research test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 Research Tests
          path: 'canon-cr3-research/target/surefire-reports/TEST-*.xml,canon-cr3-research/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Upload generated research artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cr3-research-artifacts
          path: canon-cr3-imageio/target/**
          if-no-files-found: ignore
          retention-days: 14
