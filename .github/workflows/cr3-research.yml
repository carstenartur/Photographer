name: CR3 Research Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-research/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/src/test/resources/**'
      - 'docs/cr3-results/**'
      - 'docs/cleanroom/generated-evidence.json'
      - 'scripts/manage_cr3_generated_evidence.py'
      - 'scripts/test_manage_cr3_generated_evidence.py'
      - '.github/workflows/cr3-research.yml'
      - 'pom.xml'
      - 'scripts/verify-cr3-research.sh'
      - 'scripts/test_verify_cr3_research.py'
  workflow_dispatch:
  schedule:
    - cron: '30 3 1-7 * 0'

concurrency:
  group: cr3-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research-it:
    name: CR3 research integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAVEN_OPTS: '-Xmx4g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Test research verification command
        run: python3 scripts/test_verify_cr3_research.py
      - name: Run focused pull-request evidence
        if: ${{ github.event_name == 'pull_request' }}
        run: bash scripts/verify-cr3-research.sh --focused
      - name: Run complete research integration profile
        if: ${{ github.event_name != 'pull_request' }}
        run: bash scripts/verify-cr3-research.sh --full
      - name: Publish research test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 Research Tests
          path: 'canon-cr3-research/target/surefire-reports/TEST-*.xml,canon-cr3-research/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'
      - name: Upload generated research evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cr3-research-evidence
          path: |
            canon-cr3-research/target/**/results.md
            canon-cr3-research/target/**/results.json
            canon-cr3-research/target/**/results.tsv
            canon-cr3-research/target/**/*.csv
            canon-cr3-research/target/**/*.png
            canon-cr3-research/target/surefire-reports/
            canon-cr3-research/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
