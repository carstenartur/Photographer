name: CCAPI Packaged Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'docker/ccapi-secrets/**'
      - 'scripts/verify_ccapi_packaged_runtime.sh'
      - 'app/src/main/java/com/photographer/focusstack/app/config/Ccapi*.java'
      - 'app/src/main/java/com/photographer/focusstack/FocusStackApplication.java'
      - 'app/src/main/resources/application-docker.yml'
      - 'app/src/test/java/com/photographer/focusstack/app/config/Ccapi*.java'
      - '.github/workflows/ccapi-packaged-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccapi-packaged-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binding-contract:
    name: Config-tree binding contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Test external binding and startup validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ccapi-packaged-runtime
          mvn -B --no-transfer-progress test \
            -pl app -am \
            -Dtest=CcapiAuthenticationPropertiesTest,CcapiConfigTreeBindingTest,CcapiCredentialStartupValidatorTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Djava.awt.headless=true \
            2>&1 | tee target/ccapi-packaged-runtime/binding-contract.log
      - name: Publish binding tests
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CCAPI config-tree binding tests
          path: 'app/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload binding diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccapi-binding-contract-diagnostics
          path: |
            target/ccapi-packaged-runtime/binding-contract.log
            app/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  packaged-runtime:
    name: Image secrets and bounded shutdown
    needs: binding-contract
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run packaged-runtime smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ccapi-packaged-runtime
          bash scripts/verify_ccapi_packaged_runtime.sh \
            2>&1 | tee target/ccapi-packaged-runtime/runtime-smoke.log
      - name: Upload packaged-runtime diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccapi-packaged-runtime-diagnostics
          path: target/ccapi-packaged-runtime/runtime-smoke.log
          if-no-files-found: error
          retention-days: 7
