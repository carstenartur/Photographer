name: Frontend diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  astro-sessions-test:
    name: Astro Sessions Vitest diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run focused test with JSON output
        continue-on-error: true
        run: npm test -- src/pages/AstroSessions.test.jsx --reporter=json --outputFile=vitest-results.json

      - name: Upload focused test diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: astro-sessions-vitest-diagnostics-${{ github.run_attempt }}
          path: frontend-web/vitest-results.json
          if-no-files-found: error
          retention-days: 1
