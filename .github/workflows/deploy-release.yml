name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (optional, defaults to the current version without -SNAPSHOT)'
        type: string
      development_version:
        description: 'Next development version (optional, defaults to the next patch SNAPSHOT)'
        type: string
      dry_run:
        description: 'Test the complete local Maven release without publishing'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && !(github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release: publish')) && github.run_id || 'photographer-release' }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and perform Maven release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.merge_commit_sha == github.sha &&
        contains(github.event.pull_request.labels.*.name, 'release: publish')))
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      stable_sha: ${{ steps.maven.outputs.stable_sha }}
      release_tag: ${{ steps.maven.outputs.release_tag }}
      development_version: ${{ steps.maven.outputs.development_version }}
      snapshot_branch: ${{ steps.maven.outputs.snapshot_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Prepare and perform the selected release
        id: maven
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          options=(--release-version "$RELEASE_VERSION" --development-version "$DEVELOPMENT_VERSION")
          if [[ "$DRY_RUN" == true ]]; then options+=(--dry-run); fi
          python3 scripts/release_handoff.py "${options[@]}"

  snapshot:
    name: Open next development PR
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Open or reuse the snapshot PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.release_tag }}
          DEVELOPMENT: ${{ needs.release.outputs.development_version }}
          BRANCH: ${{ needs.release.outputs.snapshot_branch }}
        run: |
          echo "Snapshot branch: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/release_handoff.py --open-snapshot "$BRANCH" --release-version "${TAG#v}" --development-version "$DEVELOPMENT"

  docker:
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      STABLE_SHA: ${{ needs.release.outputs.stable_sha }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/photographer/focusstack
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.stable_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check for an existing release image
        id: image
        run: python3 scripts/release_docker.py check
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.stable_sha }}
      - uses: docker/build-push-action@v7
        id: build
        if: steps.image.outputs.exists == 'false'
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify the release image and update the applicable aliases
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest || steps.image.outputs.digest }}
        run: python3 scripts/release_docker.py promote

  fiji:
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      actions: read
      contents: write
      pages: write
    uses: ./.github/workflows/cr3-fiji-distribution.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      merged_sha: ${{ needs.release.outputs.stable_sha }}

  central:
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/cr3-central-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      merged_sha: ${{ needs.release.outputs.stable_sha }}
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      MAVEN_GPG_FINGERPRINT: ${{ secrets.MAVEN_GPG_FINGERPRINT }}
