name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); preparation only, leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Compatibility input; must be false for qualified preparation or resume'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build without publishing or changing remote refs'
        required: false
        type: boolean
        default: true
      resume_release_pr:
        description: 'Normally merged stable preparation PR number; empty prepares a stable PR handoff'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read
  pull-requests: write
  packages: write

concurrency:
  group: protected-release-handoff
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/photographer/focusstack
  DRY_RUN: ${{ inputs.dry_run }}
  SKIP_TESTS: ${{ inputs.skip_tests }}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout exact dispatched main control commit with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The repository helper derives consistent Maven project.version/revision,
      # uses the existing version planner, and runs the full mvn -B clean verify.
      # Preparation stops at R. Only an explicit verified resume may publish M.
      - name: Prepare protected handoff or validate explicit merged release resume
        id: handoff
        env:
          EXACT_NEXT_VERSION: ${{ inputs.next_development_version }}
          NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
          RESUME_RELEASE_PR: ${{ inputs.resume_release_pr }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RESUME_RELEASE_PR" ]]; then
            python3 scripts/release_handoff.py prepare \
              --next-development-version "$EXACT_NEXT_VERSION" \
              --increment "$NEXT_VERSION_INCREMENT" \
              --dry-run "$DRY_RUN" --skip-tests "$SKIP_TESTS"
          else
            python3 scripts/release_handoff.py resume \
              --resume-release-pr "$RESUME_RELEASE_PR" \
              --next-development-version "$EXACT_NEXT_VERSION" \
              --dry-run "$DRY_RUN" --skip-tests "$SKIP_TESTS"
          fi

      - name: Guard publication and create exact stable tag and application release
        if: ${{ steps.handoff.outputs.verified_resume == 'true' && !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_handoff.py publish \
            --dry-run "$DRY_RUN" --skip-tests "$SKIP_TESTS"

      - name: Log in to GitHub Container Registry
        if: ${{ steps.handoff.outputs.verified_resume == 'true' && !inputs.dry_run }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ steps.handoff.outputs.verified_resume == 'true' && !inputs.dry_run }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.handoff.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.handoff.outputs.release }}
            type=semver,pattern={{major}},value=v${{ steps.handoff.outputs.release }}

      - name: Recheck exact stable source and publication targets before image publication
        if: ${{ steps.handoff.outputs.verified_resume == 'true' && !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_handoff.py image-guard \
            --dry-run "$DRY_RUN" --skip-tests "$SKIP_TESTS"

      - name: Build and push Docker image from merged stable checkout
        if: ${{ steps.handoff.outputs.verified_resume == 'true' && !inputs.dry_run }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Preserve maintenance responsibility and stage next snapshot handoff
        if: ${{ steps.handoff.outputs.verified_resume == 'true' && !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_handoff.py finish \
            --dry-run "$DRY_RUN" --skip-tests "$SKIP_TESTS"
