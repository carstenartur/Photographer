name: Finalize CCAPI scroll and legacy stop body

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ccapi-scroll.yml'

permissions:
  contents: read

concurrency:
  group: finalize-ccapi-scroll-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hardening/ccapi-liveview-scroll'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Apply protocol and lifecycle finalizations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stop_old = 'ccapiPost(url, Map.of("liveviewsize", "off"));'
          stop_new = ('ccapiPost(url, Map.of(\n'
                      '                        "liveviewsize", "off",\n'
                      '                        "cameradisplay", "on"));')
          for path_name in [
              'app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiBackend.java',
              'app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiStatusBackend.java',
          ]:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(stop_old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one legacy stop body, found {count}')
              path.write_text(text.replace(stop_old, stop_new), encoding='utf-8')

          production = Path(
              'app/src/main/java/com/photographer/focusstack/camera/backend/'
              'CanonCcapiProductionBackend.java'
          )
          text = production.read_text(encoding='utf-8')
          capture_old = '''        scrollLiveViewReader.stop();
                  liveViewClient.markStopped();
                  return delegate.capture();'''
          capture_new = '''        try {
                      scrollLiveViewReader.stop();
                  } finally {
                      liveViewClient.markStopped();
                  }
                  return delegate.capture();'''
          if text.count(capture_old) != 1:
              raise SystemExit(
                  f'{production}: expected one scroll capture lifecycle block')
          text = text.replace(capture_old, capture_new)

          comparator_old = '''.max(Comparator.comparingInt(entry -> versionNumber(endpointPath(entry.getValue())))
                                  .thenComparing(entry -> endpointPath(entry.getValue())))'''
          comparator_new = '''.max(Comparator.comparingInt(
                                  (Map.Entry<String, String> entry) ->
                                          versionNumber(endpointPath(entry.getValue())))
                                  .thenComparing(entry -> endpointPath(entry.getValue())))'''
          if text.count(comparator_old) != 1:
              raise SystemExit(
                  f'{production}: expected one scroll endpoint comparator')
          production.write_text(
              text.replace(comparator_old, comparator_new), encoding='utf-8')
          PY

          git diff --check
          git diff -- \
            app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiBackend.java \
            app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiStatusBackend.java \
            app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiProductionBackend.java

      - name: Run focused CCAPI live-view tests
        shell: bash
        run: |
          mvn -B --no-transfer-progress clean test \
            -pl app -am \
            -Dtest=CanonCcapiScrollLiveViewReaderTest,CanonCcapiScrollCaptureLifecycleTest,CanonCcapiProductionLiveViewTest,CanonCcapiStatusBackendTest,CcapiLiveViewClientTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Djava.awt.headless=true

      - name: Publish verified product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-ccapi-scroll.yml
          git add -A
          git commit -m 'fix(ccapi): finalize scroll cancellation and stop bodies'
          git push origin HEAD:hardening/ccapi-liveview-scroll
