name: Generated evidence diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Capture generated-evidence verifier output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run verifier
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/manage_cr3_generated_evidence.py --root . verify \
            > generated-evidence-verify.log 2>&1
          status=$?
          echo "exit_code=$status" >> generated-evidence-verify.log
          exit 0

      - name: Upload verifier diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: generated-evidence-verifier-${{ github.run_attempt }}
          path: generated-evidence-verify.log
          if-no-files-found: error
          retention-days: 1
