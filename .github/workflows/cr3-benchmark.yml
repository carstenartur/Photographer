name: CR3 Benchmark History

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - 'scripts/compare_jmh.py'
      - 'scripts/test_compare_jmh.py'
      - 'scripts/run_jmh_compare_refs.py'
      - 'scripts/test_run_jmh_compare_refs.py'
      - 'scripts/prepare_jmh_history.py'
      - 'scripts/test_prepare_jmh_history.py'
      - '.github/workflows/cr3-benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-benchmark/**'
      - 'scripts/compare_jmh.py'
      - 'scripts/test_compare_jmh.py'
      - 'scripts/run_jmh_compare_refs.py'
      - 'scripts/test_run_jmh_compare_refs.py'
      - 'scripts/prepare_jmh_history.py'
      - 'scripts/test_prepare_jmh_history.py'
      - '.github/workflows/cr3-benchmark.yml'
  schedule:
    # Longitudinal full-suite history; PRs use the short same-runner sentinel below.
    - cron: '0 5 * * 0'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH Benchmarks (Canon CR3)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MAVEN_OPTS: '-Xmx2g'

    steps:
      - name: Checkout repository with base and head history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Prepare benchmark output directory
        shell: bash
        run: echo "JMH_OUTPUT_DIR=${RUNNER_TEMP}/cr3-jmh" >> "$GITHUB_ENV"

      - name: Test benchmark tooling
        run: |
          python3 scripts/test_compare_jmh.py
          python3 scripts/test_run_jmh_compare_refs.py
          python3 scripts/test_prepare_jmh_history.py

      - name: Record scheduled benchmark environment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JMH_OUTPUT_DIR"
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "event=${{ github.event_name }}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -a)"
            echo
            echo '## CPU'
            lscpu
            echo
            echo '## Java'
            java -version 2>&1
            echo
            echo '## Maven'
            mvn -version
          } > "$JMH_OUTPUT_DIR/environment.txt"

      - name: Compare pull-request base and head on the same runner
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python3 scripts/run_jmh_compare_refs.py \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --output-dir "$JMH_OUTPUT_DIR" \
            --threshold 1.15 \
            --fail-on-regression
          comparison_status=$?
          set -e

          if [ -f "$JMH_OUTPUT_DIR/comparison.md" ]; then
            cat "$JMH_OUTPUT_DIR/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$comparison_status"

      - name: Upload pull-request benchmark comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cr3-jmh-pr-comparison
          path: ${{ runner.temp }}/cr3-jmh/
          if-no-files-found: error
          retention-days: 7

      - name: Build full benchmark suite
        if: github.event_name != 'pull_request'
        run: >-
          mvn -B --no-transfer-progress -DskipTests
          -P benchmarks
          -pl canon-cr3-benchmark -am
          package
          -Djava.awt.headless=true

      - name: Run full JMH benchmark suite
        if: github.event_name != 'pull_request'
        run: >-
          java -Djava.awt.headless=true
          -Dsamples.dir=$GITHUB_WORKSPACE/canon-cr3-imageio/src/test/resources/samples
          -jar canon-cr3-benchmark/target/benchmarks.jar
          -rf json
          -rff jmh-result.json

      - name: Measure allocations per full RAW-to-RGB import
        if: github.event_name != 'pull_request'
        run: >-
          java -Djava.awt.headless=true
          -jar canon-cr3-benchmark/target/benchmarks.jar
          Cr3ImageImportBenchmark.importProcessedRawViaImageIo
          -prof gc -bm ss -wi 2 -i 5 -f 1 -foe true
          -jvmArgs '-Xms24m -Xmx512m -XX:ActiveProcessorCount=1 -XX:+UseSerialGC'
          -p sample=sample.cr3,eosr-iso-low.cr3
          -rf json -rff rgb-import-profile.json

      - name: Prepare readable chart labels
        if: github.event_name != 'pull_request'
        run: >-
          python3 scripts/prepare_jmh_history.py jmh
          jmh-result.json
          jmh-history.json

      - name: Upload raw and chart-ready full-suite JMH JSON
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jmh-result
          path: |
            jmh-result.json
            jmh-history.json
            rgb-import-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload benchmark environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cr3-jmh-environment
          path: ${{ runner.temp }}/cr3-jmh/environment.txt
          if-no-files-found: error
          retention-days: 30

      - name: Checkout existing benchmark history
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: benchmark-history
          fetch-depth: 1

      - name: Migrate existing history to readable series identities
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          history_file='benchmark-history/dev/bench/data.js'
          if [[ ! -f "$history_file" ]]; then
            echo 'No existing benchmark history to migrate.'
            exit 0
          fi

          python3 scripts/prepare_jmh_history.py history \
            "$history_file" \
            "$history_file"

          if git -C benchmark-history diff --quiet -- dev/bench/data.js; then
            echo 'Benchmark history already uses readable series identities.'
            exit 0
          fi

          git -C benchmark-history config user.name 'github-actions[bot]'
          git -C benchmark-history config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C benchmark-history add dev/bench/data.js
          git -C benchmark-history commit -m 'Migrate benchmark history labels'
          git -C benchmark-history push origin HEAD:gh-pages

      - name: Publish main history to gh-pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Canon CR3 JMH Benchmarks
          tool: jmh
          output-file-path: jmh-history.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
