name: Finalize bounded CCAPI scroll consumer v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ccapi-scroll-consumer-v2.yml'

permissions:
  contents: read

concurrency:
  group: finalize-ccapi-scroll-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hardening/ccapi-liveview-scroll-consumer'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 61
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Integrate bounded scroll transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/ccapi-scroll
          python3 .github/scripts/finalize_ccapi_scroll_consumer.py
          git diff --check
          git diff --stat | tee .ci/ccapi-scroll/source-stat.txt

      - name: Run focused scroll and lifecycle tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress clean test \
            -pl app -am \
            -Dtest=CcapiScrollFrameTransportTest,CcapiLiveViewClientTest,CanonCcapiProductionLiveViewTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Djava.awt.headless=true \
            2>&1 | tee .ci/ccapi-scroll/focused.log

      - name: Run complete application verification
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress clean verify \
            -pl common-api,app -am \
            -Djava.awt.headless=true \
            2>&1 | tee .ci/ccapi-scroll/verify.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccapi-scroll-consumer-v2-${{ github.run_attempt }}
          path: |
            .ci/ccapi-scroll
            **/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-ccapi-scroll-consumer-v2.yml
          git rm .github/workflows/finalize-ccapi-scroll-consumer.yml
          git rm .github/scripts/finalize_ccapi_scroll_consumer.py
          git rm .github/scripts/fix_ccapi_scroll_production_test.py
          rm -rf .ci/ccapi-scroll
          git add -A
          git commit -m 'feat(ccapi): consume one bounded scroll live-view frame'
          git push origin HEAD:hardening/ccapi-liveview-scroll-consumer
