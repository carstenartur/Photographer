name: CR3 D14 Diagnostic Patterns

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/cr3-patterns/**'
      - '.github/workflows/cr3-d14-patterns.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cr3-d14-patterns-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regenerate and render pattern pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic generator dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Regenerate in an isolated directory
        run: |
          set -euo pipefail
          mkdir -p target/d14-patterns
          python docs/cr3-patterns/generate_cr3_patterns.py --out-dir target/d14-patterns
          cmp docs/cr3-patterns/pattern-manifest.json target/d14-patterns/pattern-manifest.json
          cmp docs/cr3-patterns/cr3-diagnostic-patterns-screen-16x9.pdf target/d14-patterns/cr3-diagnostic-patterns-screen-16x9.pdf
          cmp docs/cr3-patterns/cr3-diagnostic-patterns-print-a4-landscape.pdf target/d14-patterns/cr3-diagnostic-patterns-print-a4-landscape.pdf
      - name: Verify page count and representative renders
        run: |
          set -euo pipefail
          for file in target/d14-patterns/*.pdf; do
            test "$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')" = 49
          done
          mkdir -p target/d14-renders
          pdftoppm -f 1 -l 1 -singlefile -png -r 90 target/d14-patterns/cr3-diagnostic-patterns-screen-16x9.pdf target/d14-renders/cover >/dev/null 2>&1
          pdftoppm -f 37 -l 37 -singlefile -png -r 90 target/d14-patterns/cr3-diagnostic-patterns-screen-16x9.pdf target/d14-renders/graycode >/dev/null 2>&1
          pdftoppm -f 45 -l 45 -singlefile -png -r 90 target/d14-patterns/cr3-diagnostic-patterns-screen-16x9.pdf target/d14-renders/prbs >/dev/null 2>&1
          test -s target/d14-renders/cover.png
          test -s target/d14-renders/graycode.png
          test -s target/d14-renders/prbs.png
      - name: Upload verification renders
        uses: actions/upload-artifact@v7
        with:
          name: cr3-d14-pattern-verification
          path: target/d14-renders/
          if-no-files-found: error
          retention-days: 14
