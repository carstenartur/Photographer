name: Implement coordinated CCAPI shutdown v2

on:
  push:
    branches:
      - automation/implement-ccapi-shutdown-v2

permissions:
  contents: write

concurrency:
  group: implement-ccapi-shutdown-v2
  cancel-in-progress: true

jobs:
  implement-test-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip shutdown v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Implement and verify shutdown lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee shutdown-v2.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune

          record_failure() {
            status=$?
            set +e
            grep -E '\[ERROR\]|COMPILATION|BUILD FAILURE|Failures:|Errors:|cannot find symbol|AssertionFailedError' shutdown-v2.log \
              | tail -n 120 \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' > /tmp/shutdown-v2-diagnostics.txt
            git switch automation/implement-ccapi-shutdown-v2
            cat > ccapi-shutdown-v2.status <<EOF
          status=failure
          source_commit=${GITHUB_SHA}
          exit_code=${status}
          EOF
            cp /tmp/shutdown-v2-diagnostics.txt ccapi-shutdown-v2.diagnostics.txt
            git add ccapi-shutdown-v2.status ccapi-shutdown-v2.diagnostics.txt
            git commit -m "ci(ccapi): record shutdown v2 failure [skip shutdown v2]" || true
            git push origin automation/implement-ccapi-shutdown-v2 || true
            exit "$status"
          }
          trap record_failure ERR

          git switch -C shutdown-v2 origin/hardening/ccapi-coordinated-shutdown-v2

          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected exactly one anchor, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new))

          # Lease manager contract and race-free shutdown gate.
          replace_once(
              'app/src/main/java/com/photographer/focusstack/camera/session/CameraSessionLeaseManager.java',
              '    CameraSessionLeaseMetrics metrics();\n}',
              '''    CameraSessionLeaseMetrics metrics();

    /** Blocks all subsequent acquisitions while existing handles may still close. */
    default void beginShutdown() {
        // Unmanaged/test implementations have no process-local lifecycle state.
    }
}''')

