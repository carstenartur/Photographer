name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-verify:
    name: Java Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    env:
      MAVEN_OPTS: "-Xmx2g"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate CR3 reference manifest
        run: python3 scripts/validate_cr3_manifest.py

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build and verify (unit + Testcontainers integration tests)
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress clean verify \
            -pl common-api,plugin-api,capture-core,storage,camera-ptp,hdr-core,video-core,face-analysis-core,face-profile-core,session-core,observer-core,ai-vision,astro-core,canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-imageio,canon-cr3-cli,app \
            -am \
            -Djava.awt.headless=true \
            2>&1 | tee maven-build.log

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Upload raw build, test and coverage data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-build-data
          path: |
            maven-build.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 1

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [java-verify, frontend-build]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: focusstack:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  report-site:
    name: Maven Site & Badge Reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: java-verify
    if: ${{ github.event_name != 'pull_request' && needs.java-verify.result == 'success' }}
    permissions:
      contents: read
    env:
      MAVEN_OPTS: "-Xmx2g"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Download raw test and coverage data
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: java-build-data
          path: .

      - name: Generate test HTML reports and coverage data
        run: |
          mvn -B site surefire-report:report --no-transfer-progress -DskipTests \
            -pl common-api,plugin-api,capture-core,storage,camera-ptp,hdr-core,video-core,face-analysis-core,face-profile-core,session-core,observer-core,ai-vision,astro-core,canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-imageio,canon-cr3-cli,app \
            -am \
            -Djava.awt.headless=true
          report_source=""
          for candidate in \
            app/target/site/surefire-report.html \
            app/target/reports/surefire.html \
            app/target/site/surefire.html
          do
            if [ -f "$candidate" ]; then
              report_source="$candidate"
              break
            fi
          done
          if [ -n "$report_source" ] && [ "$report_source" != "app/target/site/surefire-report.html" ]; then
            cp "$report_source" app/target/site/surefire-report.html
          fi
          if [ -f app/target/site/surefire-report.html ]; then
            sed -i "s|</body>|<!-- Build: ${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ) --></body>|" app/target/site/surefire-report.html
          fi

      - name: Generate badge JSON files
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import xml.etree.ElementTree as ET

          COVERAGE_GREEN_THRESHOLD = 80
          COVERAGE_YELLOW_THRESHOLD = 60

          try:
              covered, missed = 0, 0
              for jacoco_file in glob.glob('**/target/site/jacoco/jacoco.xml', recursive=True):
                  root = ET.parse(jacoco_file).getroot()
                  counter = next(
                      (item for item in root.findall('counter')
                       if item.get('type') == 'INSTRUCTION'),
                      None,
                  )
                  if counter is not None:
                      covered += int(counter.get('covered', 0))
                      missed += int(counter.get('missed', 0))
              total = covered + missed
              percentage = round(covered / total * 100) if total else 0
              if percentage >= COVERAGE_GREEN_THRESHOLD:
                  color = 'brightgreen'
              elif percentage >= COVERAGE_YELLOW_THRESHOLD:
                  color = 'yellow'
              else:
                  color = 'red'
              badge = {
                  'schemaVersion': 1,
                  'label': 'coverage',
                  'message': f'{percentage}%',
                  'color': color,
              }
          except Exception as exception:
              print(f'Coverage badge generation failed: {exception}')
              badge = {
                  'schemaVersion': 1,
                  'label': 'coverage',
                  'message': 'unknown',
                  'color': 'lightgrey',
              }
          os.makedirs('app/target/site/jacoco', exist_ok=True)
          with open('app/target/site/jacoco/badge.json', 'w', encoding='utf-8') as output:
              json.dump(badge, output)

          try:
              files = (
                  glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)
                  + glob.glob('**/target/failsafe-reports/TEST-*.xml', recursive=True)
              )
              total_tests = total_failures = total_errors = 0
              for path in files:
                  root = ET.parse(path).getroot()
                  total_tests += int(root.get('tests', 0))
                  total_failures += int(root.get('failures', 0))
                  total_errors += int(root.get('errors', 0))
              failed = total_failures + total_errors
              if failed:
                  message, color = f'{failed}/{total_tests} failed', 'red'
              else:
                  message, color = f'{total_tests} passed', 'brightgreen'
              badge = {
                  'schemaVersion': 1,
                  'label': 'tests',
                  'message': message,
                  'color': color,
              }
          except Exception as exception:
              print(f'Tests badge generation failed: {exception}')
              badge = {
                  'schemaVersion': 1,
                  'label': 'tests',
                  'message': 'unknown',
                  'color': 'lightgrey',
              }
          os.makedirs('app/target/site', exist_ok=True)
          with open('app/target/site/badge.json', 'w', encoding='utf-8') as output:
              json.dump(badge, output)
          EOF

      - name: Upload site artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-reports
          path: app/target/site/
          if-no-files-found: warn
          retention-days: 1

  deploy-reports:
    name: Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [java-verify, report-site]
    if: ${{ github.ref == 'refs/heads/main' && needs.java-verify.result == 'success' && needs.report-site.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Download site artifacts
        uses: actions/download-artifact@v8
        with:
          name: site-reports
          path: site/

      - name: Deploy test report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: tests
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Surefire test report ${{ github.sha }}'

      - name: Deploy coverage report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/jacoco
          destination_dir: coverage
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy JaCoCo coverage report'

      - name: Report URLs
        run: |
          echo "### 📊 Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📋 [View Test Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tests/surefire-report.html)" >> "$GITHUB_STEP_SUMMARY"
          echo "📈 [View Coverage Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)" >> "$GITHUB_STEP_SUMMARY"
