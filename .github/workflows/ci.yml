name: Finalize CCAPI scroll branch

on:
  push:
    branches: [hardening/ccapi-liveview-scroll]

concurrency:
  group: finalize-ccapi-scroll-product
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: hardening/ccapi-liveview-scroll
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Apply final production fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path

          for path_name in [
              'app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiBackend.java',
              'app/src/main/java/com/photographer/focusstack/camera/backend/CanonCcapiStatusBackend.java',
          ]:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              old = 'ccapiPost(url, Map.of("liveviewsize", "off"));'
              new = ('ccapiPost(url, Map.of(\n'
                     '                        "liveviewsize", "off",\n'
                     '                        "cameradisplay", "on"));')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one legacy live-view stop body')
              path.write_text(text.replace(old, new), encoding='utf-8')

          production = Path(
              'app/src/main/java/com/photographer/focusstack/camera/backend/'
              'CanonCcapiProductionBackend.java')
          text = production.read_text(encoding='utf-8')
          old_capture = '''        scrollLiveViewReader.stop();
                  liveViewClient.markStopped();
                  return delegate.capture();'''
          new_capture = '''        try {
                      scrollLiveViewReader.stop();
                  } finally {
                      liveViewClient.markStopped();
                  }
                  return delegate.capture();'''
          if text.count(old_capture) != 1:
              raise SystemExit(f'{production}: expected one capture lifecycle block')
          text = text.replace(old_capture, new_capture)

          old_comparator = '''.max(Comparator.comparingInt(entry -> versionNumber(endpointPath(entry.getValue())))
                                  .thenComparing(entry -> endpointPath(entry.getValue())))'''
          new_comparator = '''.max(Comparator.comparingInt(
                                  (Map.Entry<String, String> entry) ->
                                          versionNumber(endpointPath(entry.getValue())))
                                  .thenComparing(entry -> endpointPath(entry.getValue())))'''
          if text.count(old_comparator) != 1:
              raise SystemExit(f'{production}: expected one scroll endpoint comparator')
          production.write_text(text.replace(old_comparator, new_comparator), encoding='utf-8')

          status_test = Path(
              'app/src/test/java/com/photographer/focusstack/camera/backend/'
              'CanonCcapiStatusBackendTest.java')
          test_text = status_test.read_text(encoding='utf-8')
          if test_text.count('com.fasterxml.jackson.databind') != 2:
              raise SystemExit(f'{status_test}: expected two obsolete Jackson imports')
          status_test.write_text(
              test_text.replace('com.fasterxml.jackson.databind', 'tools.jackson.databind'),
              encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/finalize-ccapi-scroll.yml
          rm -f .github/ccapi-scroll-finalize.trigger
          git diff --check

      - name: Run focused CCAPI live-view tests
        run: >-
          mvn -B --no-transfer-progress clean test
          -pl app -am
          -Dtest=CanonCcapiScrollLiveViewReaderTest,CanonCcapiScrollCaptureLifecycleTest,CanonCcapiProductionLiveViewTest,CanonCcapiStatusBackendTest,CcapiLiveViewClientTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djava.awt.headless=true

      - name: Run complete product verification
        run: >-
          mvn -B --no-transfer-progress clean verify
          -pl common-api,app -am
          -Djava.awt.headless=true

      - name: Publish cleaned product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ccapi): finalize bounded scroll live-view fallback'
          git push origin HEAD:hardening/ccapi-liveview-scroll
