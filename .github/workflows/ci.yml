name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-build:
    name: Java Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MAVEN_OPTS: "-Xmx1g"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and verify (unit + Testcontainers integration tests)
        run: mvn -B clean verify

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [java-build, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build camera-service image
        run: docker build -f docker/camera-service/Dockerfile -t camera-service:test .

      - name: Build analysis-service image
        run: docker build -f docker/analysis-service/Dockerfile -t analysis-service:test .
