name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full verification and report refresh (Sunday 04:00 UTC).
    - cron: '0 4 * * 0'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: '-Xmx1g'
  JAVA_MODULES: common-api,plugin-api,capture-core,storage,camera-ptp,hdr-core,video-core,face-analysis-core,face-profile-core,session-core,observer-core,ai-vision,astro-core,canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-imageio,canon-cr3-cli,app

jobs:
  java-verify:
    name: Java Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Validate CR3 reference manifest
        run: python3 scripts/validate_cr3_reference_manifest.py

      - name: Build and verify (unit + Testcontainers integration tests)
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress clean verify \
            -pl "$JAVA_MODULES" -am \
            -Djava.awt.headless=true \
            2>&1 | tee maven-verify.log

      - name: Upload Maven failure log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maven-verify-log
          path: maven-verify.log
          if-no-files-found: error
          retention-days: 1

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Upload raw test and coverage data for scheduled reports
        uses: actions/upload-artifact@v7
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        with:
          name: java-test-data
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 1

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  reports:
    name: Weekly Maven Site & Badge Reports
    needs: java-verify
    if: ${{ needs.java-verify.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Download raw test and coverage data
        uses: actions/download-artifact@v8
        with:
          name: java-test-data
          path: .

      - name: Generate Maven site and test HTML reports
        run: |
          mvn -B --no-transfer-progress site surefire-report:report \
            -DskipTests \
            -pl "$JAVA_MODULES" -am \
            -Djava.awt.headless=true

          report_source=""
          for candidate in \
            app/target/site/surefire-report.html \
            app/target/reports/surefire.html \
            app/target/site/surefire.html
          do
            if [ -f "$candidate" ]; then
              report_source="$candidate"
              break
            fi
          done
          if [ -n "$report_source" ] && [ "$report_source" != "app/target/site/surefire-report.html" ]; then
            cp "$report_source" app/target/site/surefire-report.html
          fi
          if [ -f app/target/site/surefire-report.html ]; then
            sed -i "s|</body>|<!-- Build: ${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ) --></body>|" \
              app/target/site/surefire-report.html
          fi

      - name: Generate badge endpoint JSON
        run: python3 scripts/generate_ci_badges.py

      - name: Deploy test reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/target/site
          destination_dir: tests
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy scheduled test report ${{ github.sha }}'

      - name: Deploy coverage report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/target/site/jacoco
          destination_dir: coverage
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy scheduled JaCoCo report ${{ github.sha }}'
