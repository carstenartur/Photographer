name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency/environment drift check. Pushes and PRs already validate changes.
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-verify:
    name: Java Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    env:
      MAVEN_OPTS: '-Xmx2g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Validate CR3 reference manifest
        run: python3 scripts/validate_cr3_reference_manifest.py

      - name: Test repository utility scripts
        run: |
          python3 scripts/test_compare_jmh.py
          python3 scripts/test_run_jmh_compare_refs.py
          python3 scripts/test_prepare_jmh_history.py
          python3 scripts/test_validate_ccapi_transport_boundary.py
          python3 scripts/validate_ccapi_transport_boundary.py .

      - name: Build and verify product modules
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-product.sh 2>&1 | tee maven-verify.log

      - name: Compile CR3 JMH benchmark module
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress -DskipTests \
            -P benchmarks \
            -pl canon-cr3-benchmark -am \
            package \
            -Djava.awt.headless=true 2>&1 | tee maven-benchmark.log

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Upload Maven failure diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: java-verify-failure-${{ github.run_attempt }}
          path: |
            maven-verify.log
            maven-benchmark.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload report inputs for scheduled/manual reporting
        uses: actions/upload-artifact@v7
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        with:
          name: java-test-data
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 2

  frontend-build:
    name: Frontend Test, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: photographer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name photographer-test \
            -p 8080:8080 \
            -e PHOTOGRAPHER_ADMIN_PASSWORD=test-admin-password \
            -e PHOTOGRAPHER_JWT_SECRET=test-secret-key-at-least-32-characters-long \
            photographer:test

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs photographer-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f photographer-test || true
