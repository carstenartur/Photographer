name: Source snapshot diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create source snapshot
        run: |
          grep -R -n -E '@(RequestMapping|GetMapping|PostMapping|PutMapping|DeleteMapping)|registerStompEndpoints|enableSimpleBroker|setApplicationDestinationPrefixes' \
            app/src/main/java > /tmp/api-inventory.txt || true
          tar -czf /tmp/photographer-source.tgz \
            app/src/main/java \
            app/src/test/java \
            app/src/main/resources \
            frontend-web/src \
            frontend-web/package.json \
            frontend-web/package-lock.json \
            frontend-web/vite.config.js \
            frontend-web/vitest.config.js \
            docs/api.md \
            /tmp/api-inventory.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: photographer-source
          path: /tmp/photographer-source.tgz
          retention-days: 1
