name: CR3 Fiji distribution

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      merged_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      publish_existing_tag:
        type: string
        required: false
        description: 'Complete the Fiji distribution for an existing GitHub release (vX.Y.Z). Leave empty to build only.'
  pull_request:
    branches: [main]
    paths:
      - 'cr3-imagej/**'
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'pom.xml'
      - 'scripts/build_cr3_fiji_site.py'
      - 'scripts/publish_cr3_fiji_site.py'
      - 'scripts/test_publish_cr3_fiji_site.py'
      - '.github/workflows/cr3-fiji-distribution.yml'

permissions:
  contents: read

jobs:
  source:
    name: Resolve Fiji build source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.publish_existing_tag }}
          EXPECTED_SHA: ${{ inputs.merged_sha }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            case "$GITHUB_WORKFLOW_REF" in
              "$GITHUB_REPOSITORY/.github/workflows/deploy-release.yml@refs/heads/main")
                [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] ;;
              "$GITHUB_REPOSITORY/.github/workflows/cr3-fiji-distribution.yml@refs/heads/main")
                [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$EXPECTED_SHA" ]] ;;
              *) exit 1 ;;
            esac
            sha=$(python3 scripts/publish_cr3_fiji_site.py tagged-source "$RELEASE_TAG")
            [[ -z "$EXPECTED_SHA" || "$sha" == "$EXPECTED_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" == "$sha" ]]
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName |
              jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and (.isDraft or .isPrerelease | not)'
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  bundle:
    needs: source
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test update-site publication
        run: python3 -m unittest discover -s scripts -p 'test_publish_cr3_fiji_site.py'

      - name: Reuse immutable Fiji archives on a release retry
        if: needs.source.outputs.tag != ''
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" && "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]]
          archives=target/cr3-fiji-site
          mkdir -p "$archives"
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            artifact=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --paginate | jq -sr '[.[] | .artifacts[] | select((.name // "" | startswith("cr3-fiji-distribution-")) and .expired == false)] | max_by(.id) | .id // empty')
            if [[ -n "$artifact" ]]; then
              gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/fiji-retry.zip"
              unzip -q "$RUNNER_TEMP/fiji-retry.zip" cr3-fiji-install.zip cr3-fiji-update-site.zip -d "$archives"
            fi
          fi
          if [[ ! -f "$archives/cr3-fiji-update-site.zip" ]]; then
            assets=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')
            if grep -Fxq cr3-fiji-install.zip <<< "$assets" && grep -Fxq cr3-fiji-update-site.zip <<< "$assets"; then
              gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern 'cr3-fiji-*.zip' --dir "$archives"
            fi
          fi
          if [[ -f "$archives/cr3-fiji-update-site.zip" && -f "$archives/cr3-fiji-install.zip" ]]; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            rmdir "$archives"
          fi

      - name: Read the hosted update site at a specific Pages revision
        if: needs.source.outputs.tag != '' && steps.previous.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: previous-pages
          persist-credentials: false
          sparse-checkout: fiji/cr3

      - name: Load the preceding Fiji update site for a release
        if: needs.source.outputs.tag != '' && steps.previous.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          MERGED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$MERGED_SHA" && "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$MERGED_SHA" ]]
          if [[ -f previous-pages/fiji/cr3/db.xml.gz ]]; then
            python3 scripts/publish_cr3_fiji_site.py previous previous-pages/fiji/cr3 "$RUNNER_TEMP/cr3-fiji-update-site.zip"
            echo "FIJI_PREVIOUS_SITE=$RUNNER_TEMP/cr3-fiji-update-site.zip" >> "$GITHUB_ENV"
            exit 0
          fi
          for tag in $(git tag --list 'v[0-9]*' --sort=-v:refname); do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ "$tag" != "$RELEASE_TAG" ]] || continue
            git merge-base --is-ancestor "$tag^" "$MERGED_SHA^" || continue
            git cat-file -e "$tag:.github/workflows/cr3-fiji-distribution.yml" 2>/dev/null || continue
            gh release download "$tag" --pattern cr3-fiji-update-site.zip --dir "$RUNNER_TEMP"
            echo "FIJI_PREVIOUS_SITE=$RUNNER_TEMP/cr3-fiji-update-site.zip" >> "$GITHUB_ENV"
            break
          done

      - name: Extract the reference Fiji installation
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output fiji.zip \
            https://downloads.imagej.net/fiji/archive/latest/20261112-1517/fiji-latest-linux64-jdk.zip
          echo 'fb3a5206ee94434907dea34b88b84f174de08ce25b3038c7a999bc554edcda15  fiji.zip' | sha256sum --check
          unzip -q fiji.zip -x 'Fiji/java/*'
          rm fiji.zip

      - name: Build the Fiji installation and update-site archives
        if: steps.previous.outputs.reused != 'true'
        run: >-
          mvn -B -ntp -pl cr3-imagej -am verify -Pfiji-update-site
          -Dfiji.directory="$RUNNER_TEMP/Fiji" -Djava.awt.headless=true

      - name: Run the installed plugin on Fiji's Java 21 runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compare the Fiji menu import with LibRaw
        run: |
          set -euo pipefail
          unzip -q target/cr3-fiji-site/cr3-fiji-install.zip -d "$RUNNER_TEMP/Fiji"
          sample_dir="$RUNNER_TEMP/cr3-sensor-test"
          mkdir "$sample_dir"
          ln -s "$PWD/canon-cr3-imageio/src/test/resources/samples/sample.cr3" "$sample_dir/sample.cr3"
          ln -s "$PWD/canon-cr3-imageio/src/test/resources/samples/sample.reference.tiff" "$sample_dir/reference.tiff"
          timeout 120 xvfb-run -a "$RUNNER_TEMP/Fiji/fiji" --java-home "$JAVA_HOME" --mem 1g --no-splash -- \
            -batch "$PWD/cr3-imagej/src/it/verify-fiji-import.ijm" "$sample_dir"
          grep -Fx '5632x3710 16 bits 20894720 samples max=0' "$sample_dir/result.txt"

      - name: Save installation and update-site archives
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: cr3-fiji-distribution-${{ github.run_attempt }}
          path: target/cr3-fiji-site/*.zip
          if-no-files-found: error
          retention-days: 7

  attach:
    if: ${{ needs.source.outputs.tag != '' }}
    needs: [source, bundle]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          path: archives
          merge-multiple: true

      - name: Attach Fiji archives to the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          MERGED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$MERGED_SHA" ]]
          python3 scripts/publish_cr3_fiji_site.py attach "$GH_REPO" "$RELEASE_TAG" archives

  publish-site:
    name: Publish the released Fiji update site
    needs: [source, attach]
    if: needs.source.outputs.tag != ''
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      EXPECTED_SHA: ${{ needs.source.outputs.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify stable source, release asset and Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          # Maven tags the version-only commit immediately following the selected main source.
          # Historical releases tagged the main commit itself.
          git merge-base --is-ancestor "$sha" origin/main || git merge-base --is-ancestor "$sha^" origin/main
          [[ -z "$EXPECTED_SHA" || "$sha" == "$EXPECTED_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$sha" ]]
          version=$(git show "${sha}:pom.xml" | python3 -c 'import sys, xml.etree.ElementTree as E; print(E.parse(sys.stdin).findtext("{*}version"))')
          [[ "v$version" == "$RELEASE_TAG" ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName | jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and (.isDraft or .isPrerelease | not)'
          gh api "repos/$GH_REPO/pages" > "$RUNNER_TEMP/pages.json"
          jq -e '.source.branch == "gh-pages" and .source.path == "/" and .build_type == "legacy" and .public == true' "$RUNNER_TEMP/pages.json"
          gh release download "$RELEASE_TAG" --pattern cr3-fiji-update-site.zip --dir "$RUNNER_TEMP"

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: hosted
          fetch-depth: 1

      - name: Fast-forward Pages while retaining unrelated site content
        run: |
          set -euo pipefail
          git -C hosted config user.name 'github-actions[bot]'
          git -C hosted config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git -C hosted fetch --depth=1 origin refs/heads/gh-pages
            git -C hosted reset --hard FETCH_HEAD
            python3 scripts/publish_cr3_fiji_site.py install "$RUNNER_TEMP/cr3-fiji-update-site.zip" "$RELEASE_TAG" hosted
            cp LICENSE hosted/fiji/cr3/LICENSE.txt
            git -C hosted add -- fiji/cr3
            if git -C hosted diff --cached --quiet; then exit 0; fi
            git -C hosted commit -m "Publish Fiji CR3 update site $RELEASE_TAG"
            if git -C hosted push origin HEAD:refs/heads/gh-pages; then exit 0; fi
          done
          exit 1

      - name: Request the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" > /dev/null

      - name: Verify anonymous downloads of the version, database and all seven Fiji JARs
        run: |
          set -euo pipefail
          base=$(jq -er .html_url "$RUNNER_TEMP/pages.json")
          url="${base%/}/fiji/cr3/"
          python3 scripts/publish_cr3_fiji_site.py verify-served hosted/fiji/cr3 "$url" "$RELEASE_TAG"
          echo "Fiji update site: $url" >> "$GITHUB_STEP_SUMMARY"
