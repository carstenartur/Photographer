name: Astro Stacking Benchmark Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'astro-core/**'
      - 'astro-core-benchmark/**'
      - 'common-api/src/main/java/com/photographer/focusstack/common/model/AstroStacking*.java'
      - 'common-api/src/test/java/com/photographer/focusstack/common/model/AstroStacking*.java'
      - 'scripts/verify_astro_stacking_benchmark.sh'
      - '.github/workflows/astro-stacking-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: astro-stacking-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-smoke:
    name: Compile and smoke all stacking modes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAVEN_OPTS: '-Xmx2g'
      ASTRO_JMH_OUTPUT_DIR: ${{ runner.temp }}/astro-jmh-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build and run bounded benchmark smoke
        run: bash scripts/verify_astro_stacking_benchmark.sh

      - name: Upload raw smoke result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astro-stacking-jmh-smoke
          path: ${{ runner.temp }}/astro-jmh-smoke/
          if-no-files-found: warn
          retention-days: 7
