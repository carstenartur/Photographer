name: CR3 Maven Central

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      merged_sha:
        type: string
        required: true
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_PASSWORD:
        required: true
      MAVEN_GPG_KEY:
        required: true
      MAVEN_GPG_PASSPHRASE:
        required: false
      MAVEN_GPG_FINGERPRINT:
        required: false
  workflow_dispatch:
    inputs:
      operation:
        description: Central Portal operation for the selected release tag
        type: choice
        required: true
        default: validate
        options:
          - validate
          - publish

permissions:
  contents: read

concurrency:
  group: cr3-central-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  central:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release tag and checked-out commit
        env:
          CALL_TAG: ${{ inputs.release_tag }}
          MERGED_SHA: ${{ inputs.merged_sha }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          workflows="$GITHUB_REPOSITORY/.github/workflows"
          case "$GITHUB_WORKFLOW_REF" in
            "$workflows/deploy-release.yml@refs/heads/main")
              [[ "$GITHUB_REF" == refs/heads/main && "$CALL_TAG" == "$RELEASE_TAG" ]]
              [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
              source_commit=$MERGED_SHA
              ;;
            "$workflows/cr3-central-release.yml@refs/tags/$RELEASE_TAG")
              [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" && -z "$CALL_TAG$MERGED_SHA" ]]
              [[ "$MANUAL_OPERATION" == validate || "$MANUAL_OPERATION" == publish ]]
              source_commit=$GITHUB_SHA
              ;;
            *) exit 1 ;;
          esac
          tagged_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          expected_commit=$(git rev-parse --verify "$source_commit^{commit}")
          [[ "$(git rev-parse HEAD)" == "$tagged_commit" && "$tagged_commit" == "$expected_commit" ]]

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Deploy the signed public libraries
        env:
          OPERATION: ${{ inputs.release_tag && 'publish' || inputs.operation }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_FINGERPRINT }}
        run: |
          : "${CENTRAL_USERNAME:?Set CENTRAL_USERNAME}" "${CENTRAL_PASSWORD:?Set CENTRAL_PASSWORD}" "${MAVEN_GPG_KEY:?Set MAVEN_GPG_KEY}"
          version=$(mvn -N -q help:evaluate -Dexpression=revision -DforceStdout)
          [[ "v$version" == "$RELEASE_TAG" ]]
          options=()
          if [[ "$OPERATION" == publish ]]; then
            options+=(-Dcentral.autoPublish=true -Dcentral.waitUntil=published)
          fi
          mvn -B -ntp -f release/canon-cr3-public/pom.xml -Pcentral-release \
            -Dcentral.skipUpload=false -Dgpg.signer=bc "${options[@]}" clean deploy
