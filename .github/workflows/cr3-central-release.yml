name: CR3 Maven Central

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      merged_sha:
        type: string
        required: true
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_PASSWORD:
        required: true
      MAVEN_GPG_KEY:
        required: true
      MAVEN_GPG_PASSPHRASE:
        required: false
      MAVEN_GPG_FINGERPRINT:
        required: false
  workflow_dispatch:
    inputs:
      existing_tag:
        description: Published stable release tag to process when running from main (e.g. v0.1.6)
        type: string
        required: false
      operation:
        description: Central Portal operation for the selected release tag
        type: choice
        required: true
        default: validate
        options:
          - validate
          - publish

permissions:
  contents: read

concurrency:
  group: cr3-central-${{ inputs.release_tag || inputs.existing_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  central:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag || inputs.existing_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release tag and checked-out commit
        env:
          CALL_TAG: ${{ inputs.release_tag }}
          MERGED_SHA: ${{ inputs.merged_sha }}
          EXISTING_TAG: ${{ inputs.existing_tag }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          workflows="$GITHUB_REPOSITORY/.github/workflows"
          case "$GITHUB_WORKFLOW_REF" in
            "$workflows/deploy-release.yml@refs/heads/main")
              [[ "$GITHUB_REF" == refs/heads/main && "$CALL_TAG" == "$RELEASE_TAG" ]]
              [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
              source_commit=$MERGED_SHA
              ;;
            "$workflows/cr3-central-release.yml@refs/heads/main")
              [[ "$GITHUB_REF" == refs/heads/main && "$EXISTING_TAG" == "$RELEASE_TAG" && -z "$CALL_TAG$MERGED_SHA" ]]
              [[ "$MANUAL_OPERATION" == validate || "$MANUAL_OPERATION" == publish ]]
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
                jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false and .published_at != null' >/dev/null
              remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
              [[ "$remote_tag" == "$(git rev-parse --verify "refs/tags/$RELEASE_TAG")" ]]
              source_commit=$(git rev-parse --verify "$remote_tag^{commit}")
              ;;
            "$workflows/cr3-central-release.yml@refs/tags/$RELEASE_TAG")
              [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" && -z "$CALL_TAG$MERGED_SHA" ]]
              [[ "$MANUAL_OPERATION" == validate || "$MANUAL_OPERATION" == publish ]]
              source_commit=$GITHUB_SHA
              ;;
            *) exit 1 ;;
          esac
          tagged_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          expected_commit=$(git rev-parse --verify "$source_commit^{commit}")
          [[ "$(git rev-parse HEAD)" == "$tagged_commit" && "$tagged_commit" == "$expected_commit" ]]

      - name: Read the matching Git-backed distribution
        uses: actions/checkout@v7
        with:
          ref: maven-repository
          path: published-repository
          persist-credentials: false
          sparse-checkout: io/github/carstenartur

      - name: Check the public coordinates before uploading
        id: public
        run: |
          status=$(python3 scripts/verify_central_release.py "${RELEASE_TAG#v}" published-repository)
          echo "state=$status" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify the tagged Maven versions
        run: |
          for field in project.version revision; do
            version=$(mvn -N -q help:evaluate "-Dexpression=$field" -DforceStdout)
            [[ "v$version" == "$RELEASE_TAG" ]]
          done

      - name: Deploy the signed public libraries
        if: steps.public.outputs.state == 'absent'
        env:
          OPERATION: ${{ inputs.release_tag && 'publish' || inputs.operation }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          SIGNING_FINGERPRINT: ${{ secrets.MAVEN_GPG_FINGERPRINT }}
        run: |
          : "${CENTRAL_USERNAME:?Set CENTRAL_USERNAME}" "${CENTRAL_PASSWORD:?Set CENTRAL_PASSWORD}" "${MAVEN_GPG_KEY:?Set MAVEN_GPG_KEY}"
          if [[ -n "$SIGNING_FINGERPRINT" ]]; then
            export MAVEN_GPG_KEY_FINGERPRINT="$SIGNING_FINGERPRINT"
          fi
          options=()
          if [[ "$OPERATION" == publish ]]; then
            options+=(-Dcentral.autoPublish=true -Dcentral.waitUntil=published)
          fi
          mvn -B -ntp -f release/canon-cr3-public/pom.xml -Pcentral-release \
            -Dcentral.skipUpload=false -Dgpg.signer=bc "${options[@]}" clean deploy

      - name: Resolve and check the published JARs, POMs, sources and Javadocs
        if: inputs.release_tag != '' || inputs.operation == 'publish' || steps.public.outputs.state == 'published'
        run: |
          python3 scripts/verify_central_release.py "${RELEASE_TAG#v}" published-repository --wait
          echo "Verified all six public Maven Central libraries for $RELEASE_TAG and resolved a fresh Maven consumer." >> "$GITHUB_STEP_SUMMARY"
