name: Finalize coordinated CCAPI shutdown

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ccapi-shutdown.yml'

permissions:
  contents: read

concurrency:
  group: finalize-ccapi-shutdown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-harden-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hardening/ccapi-coordinated-shutdown-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Merge current main and apply reviewed hardening
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/finalize-ccapi-shutdown
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/automation/implement-ccapi-shutdown-final:refs/remotes/origin/automation/implement-ccapi-shutdown-final
          git merge --no-edit origin/main
          git show origin/automation/implement-ccapi-shutdown-final:scripts/harden_ccapi_shutdown_v2.py \
            > /tmp/harden_ccapi_shutdown_v2.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              'app/src/test/java/com/photographer/focusstack/camera/session/'
              'InMemoryCameraSessionLeaseManagerTest.java'
          )
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'        assertThatThrownBy\(\(\) -> manager\.acquire\(request\(key, "owner"\)\)\)\n'
              r'\s*\.isInstanceOf\(IllegalStateException\.class\)\n'
              r'\s*\.hasMessageContaining\("shutting down"\);'
          )
          replacement = (
              '        assertThatThrownBy(() -> manager.acquire(request(key, "owner")))\n'
              '                .isInstanceOf(IllegalStateException.class)\n'
              '                .hasMessageContaining("shutting down");'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one shutdown assertion, found {count}')
          path.write_text(text, encoding='utf-8')
          PY

          python3 /tmp/harden_ccapi_shutdown_v2.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one anchor, found {count}: {old[:100]!r}'
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'app/src/main/java/com/photographer/focusstack/camera/session/'
              'InMemoryCameraSessionLeaseManager.java',
              '''    @PreDestroy
              public void close() {
                  beginShutdown();
                  int active = leases.size();
                  if (active != 0) {
            throw new IllegalStateException(
                    "Camera session lease manager closed with " + active + " active lease(s)");
                  }
              }''',
              '''    @PreDestroy
              public void close() {
                  synchronized (lifecycleMonitor) {
                      beginShutdown();
                      int active = leases.size();
                      if (active != 0) {
                          throw new IllegalStateException(
                                  "Camera session lease manager closed with " + active
                                          + " active lease(s)");
                      }
                  }
              }'''
          )
          replace_once(
              'app/src/main/java/com/photographer/focusstack/camera/session/'
              'CameraSessionShutdownCoordinator.java',
              '      duration -> Thread.sleep(duration.toMillis()));',
              '      Thread::sleep);'
          )

          test_path = Path(
              'app/src/test/java/com/photographer/focusstack/camera/session/'
              'CameraSessionShutdownCoordinatorTest.java'
          )
          test_text = test_path.read_text(encoding='utf-8')
          import_anchor = 'import com.photographer.focusstack.astro.service.AstroModeService;\n'
          if 'CameraServiceUnavailableException;' not in test_text:
              if test_text.count(import_anchor) != 1:
                  raise SystemExit('Coordinator test import anchor is not unique')
              test_text = test_text.replace(
                  import_anchor,
                  import_anchor
                  + 'import com.photographer.focusstack.camera.exception.'
                  + 'CameraServiceUnavailableException;\n',
              )
          assertion_pattern = re.compile(
              r'(assertThatThrownBy\(\(\) -> manager\.acquire\(new CameraLeaseRequest\([\s\S]*?\)\)\)\n)'
              r'(\s*)\.isInstanceOf\(IllegalStateException\.class\)\n'
              r'(\s*)\.hasMessageContaining\("shutting down"\);',
              re.MULTILINE,
          )
          test_text, count = assertion_pattern.subn(
              lambda match: (
                  match.group(1)
                  + match.group(2)
                  + '.isInstanceOf(CameraServiceUnavailableException.class)\n'
                  + match.group(3)
                  + '.hasMessage("Camera services are shutting down");'
              ),
              test_text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one coordinator shutdown assertion, found {count}')
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Run focused lifecycle tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress test \
            -pl app -am \
            -Dtest=InMemoryCameraSessionLeaseManagerTest,CameraSessionShutdownCoordinatorTest,StackingJobLeaseIntegrationTest,GlobalExceptionHandlerShutdownTest,HdrTimelapseLeaseLifecycleTest,FaceOrbitLeaseLifecycleTest,AstroModeServiceLeaseLifecycleTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Djava.awt.headless=true \
            2>&1 | tee target/finalize-ccapi-shutdown/focused.log

      - name: Run complete app verification
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress clean verify \
            -pl common-api,app -am \
            -Djava.awt.headless=true \
            2>&1 | tee target/finalize-ccapi-shutdown/verify.log

      - name: Upload finalization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finalize-ccapi-shutdown-diagnostics
          path: |
            target/finalize-ccapi-shutdown
            **/target/surefire-reports
            **/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified product branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-ccapi-shutdown.yml
          git add -A
          git commit -m 'fix(ccapi): finish coordinated shutdown hardening'
          git push origin HEAD:hardening/ccapi-coordinated-shutdown-v2
