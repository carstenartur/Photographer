name: Finalize canonical CCAPI live-view body

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ccapi-liveview-body.yml'

permissions:
  contents: read

concurrency:
  group: finalize-ccapi-liveview-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hardening/ccapi-liveview-mode-selection'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Apply Canon-specified stop body
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/liveview-body-gate
          python3 - <<'PY'
          from pathlib import Path

          old = '"{\\"liveviewsize\\":\\"off\\"}"'
          new = '"{\\"liveviewsize\\":\\"off\\",\\"cameradisplay\\":\\"on\\"}"'

          production = Path(
              'app/src/main/java/com/photographer/focusstack/camera/backend/'
              'CcapiLiveViewClient.java'
          )
          text = production.read_text(encoding='utf-8')
          production_old = old + '.getBytes(StandardCharsets.UTF_8);'
          production_new = new + '\n                    .getBytes(StandardCharsets.UTF_8);'
          if text.count(production_old) != 1:
              raise SystemExit('Expected one production stop-body constant')
          production.write_text(text.replace(production_old, production_new), encoding='utf-8')

          for path_name, expected in [
              (
                  'app/src/test/java/com/photographer/focusstack/camera/backend/'
                  'CcapiLiveViewClientTest.java',
                  2,
              ),
              (
                  'app/src/test/java/com/photographer/focusstack/camera/backend/'
                  'CanonCcapiProductionLiveViewTest.java',
                  1,
              ),
          ]:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} old assertions, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run focused live-view tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress test \
            -pl app -am \
            -Dtest=CcapiLiveViewClientTest,CanonCcapiProductionLiveViewTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Djava.awt.headless=true \
            2>&1 | tee target/liveview-body-gate/focused.log

      - name: Run complete application verification
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress clean verify \
            -pl common-api,app -am \
            -Djava.awt.headless=true \
            2>&1 | tee target/liveview-body-gate/verify.log

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccapi-liveview-body-gate
          path: |
            target/liveview-body-gate
            **/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-ccapi-liveview-body.yml
          git add -A
          git commit -m 'fix(ccapi): send complete Canon live-view stop body'
          git push origin HEAD:hardening/ccapi-liveview-mode-selection
