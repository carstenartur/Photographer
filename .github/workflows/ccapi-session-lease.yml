name: CCAPI Session Lease

on:
  pull_request:
    paths:
      - 'common-api/src/main/java/com/photographer/focusstack/common/model/AstroCaptureConfig.java'
      - 'app/src/main/java/com/photographer/focusstack/camera/session/**'
      - 'app/src/main/java/com/photographer/focusstack/camera/service/StackingJobService.java'
      - 'app/src/main/java/com/photographer/focusstack/camera/service/DirectCameraControlExecutor.java'
      - 'app/src/main/java/com/photographer/focusstack/camera/controller/CameraController.java'
      - 'app/src/main/java/com/photographer/focusstack/camera/controller/HdrTimelapseController.java'
      - 'app/src/main/java/com/photographer/focusstack/astro/**'
      - 'app/src/main/java/com/photographer/focusstack/app/config/SessionConfig.java'
      - 'app/src/main/java/com/photographer/focusstack/app/web/exception/GlobalExceptionHandler.java'
      - 'app/src/test/java/com/photographer/focusstack/camera/session/**'
      - 'app/src/test/java/com/photographer/focusstack/camera/service/*Lease*.java'
      - 'app/src/test/java/com/photographer/focusstack/camera/service/DirectCameraControlExecutorTest.java'
      - 'app/src/test/java/com/photographer/focusstack/camera/controller/CameraControllerTest.java'
      - 'app/src/test/java/com/photographer/focusstack/camera/controller/HdrTimelapseControllerTest.java'
      - 'app/src/test/java/com/photographer/focusstack/astro/**'
      - 'session-core/src/main/java/com/photographer/focusstack/session/**'
      - 'session-core/src/test/java/com/photographer/focusstack/session/**'
      - 'docs/ccapi-session-ownership.md'
      - '.github/workflows/ccapi-session-lease.yml'
  workflow_dispatch:

concurrency:
  group: ccapi-session-lease-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lease-tests:
    name: Exclusive ownership tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: '-Xmx2g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Run app and dependency unit tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress test \
            -pl app \
            -am \
            -Djava.awt.headless=true \
            2>&1 | tee ccapi-session-lease-maven.log
      - name: Publish lease test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CCAPI Session Lease Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'
      - name: Upload Maven failure diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ccapi-session-lease-failure
          path: |
            ccapi-session-lease-maven.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 3
