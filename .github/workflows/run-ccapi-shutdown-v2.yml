name: Run coordinated CCAPI shutdown v2 implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/implement-ccapi-shutdown-v2.yml'
      - '.github/workflows/run-ccapi-shutdown-v2.yml'
      - 'ccapi-shutdown-v2.trigger'

permissions:
  contents: write

concurrency:
  group: run-ccapi-shutdown-v2
  cancel-in-progress: true

jobs:
  run-versioned-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      inner-exit-code: ${{ steps.implementation.outputs.inner-exit-code }}
      diagnostic-base64: ${{ steps.implementation.outputs.diagnostic-base64 }}
    steps:
      - name: Checkout technical head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Execute reviewed implementation and retain bounded status
        id: implementation
        shell: bash
        run: |
          set +e
          status=0
          mkdir -p target/shutdown-v2-diagnostics
          : > target/shutdown-v2-diagnostics/outer.log

          python - <<'PY' > target/shutdown-v2-diagnostics/extract.log 2>&1
          from pathlib import Path

          source = Path('.github/workflows/implement-ccapi-shutdown-v2.yml').read_text()
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(
                  f'expected one implementation run marker, found {source.count(marker)}')
          raw = source.split(marker, 1)[1]
          yaml_prefix = '          '
          lines = [
              line[len(yaml_prefix):] if line.startswith(yaml_prefix) else line
              for line in raw.splitlines()
          ]
          Path('/tmp/implement-ccapi-shutdown-v2.sh').write_text(
              '\n'.join(lines) + '\n')
          PY
          extract_status=$?
          if [ "$extract_status" -ne 0 ]; then
            status=$extract_status
          fi

          if [ "$status" -eq 0 ]; then
            git fetch origin \
              +refs/heads/hardening/ccapi-coordinated-shutdown-v2:refs/remotes/origin/hardening/ccapi-coordinated-shutdown-v2 \
              +refs/heads/automation/implement-ccapi-shutdown-v2:refs/remotes/origin/automation/implement-ccapi-shutdown-v2 \
              > target/shutdown-v2-diagnostics/fetch.log 2>&1
            fetch_status=$?
            if [ "$fetch_status" -ne 0 ]; then
              status=$fetch_status
            fi
          fi

          if [ "$status" -eq 0 ]; then
            bash /tmp/implement-ccapi-shutdown-v2.sh \
              > target/shutdown-v2-diagnostics/outer.log 2>&1
            status=$?
          fi

          cat target/shutdown-v2-diagnostics/extract.log \
              target/shutdown-v2-diagnostics/fetch.log \
              target/shutdown-v2-diagnostics/outer.log 2>/dev/null \
              > target/shutdown-v2-diagnostics/combined.log

          grep -E '\[ERROR\]|COMPILATION|BUILD FAILURE|Failures:|Errors:|cannot find symbol|AssertionFailedError|Traceback|expected exactly one anchor|mismatch|fatal:|ModuleNotFoundError|KeyError|ValueError|Process completed|SyntaxError' \
            target/shutdown-v2-diagnostics/combined.log | tail -n 40 \
            > target/shutdown-v2-diagnostics/focused.log || true
          if [ ! -s target/shutdown-v2-diagnostics/focused.log ]; then
            tail -n 30 target/shutdown-v2-diagnostics/combined.log \
              > target/shutdown-v2-diagnostics/focused.log
          fi

          echo "inner-exit-code=$status" >> "$GITHUB_OUTPUT"
          echo "diagnostic-base64=$(base64 -w0 target/shutdown-v2-diagnostics/focused.log)" \
            >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload shutdown implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccapi-shutdown-v2-diagnostics
          path: target/shutdown-v2-diagnostics
          if-no-files-found: error
          retention-days: 14

  report-diagnostics:
    if: always()
    needs: run-versioned-implementation
    runs-on: ubuntu-latest
    steps:
      - name: Print focused shutdown diagnostic and evaluate status
        shell: bash
        env:
          DIAGNOSTIC_BASE64: ${{ needs.run-versioned-implementation.outputs.diagnostic-base64 }}
          INNER_EXIT_CODE: ${{ needs.run-versioned-implementation.outputs.inner-exit-code }}
        run: |
          echo '--- coordinated shutdown focused diagnostic ---'
          if [ -n "$DIAGNOSTIC_BASE64" ]; then
            printf '%s' "$DIAGNOSTIC_BASE64" | base64 -d
          else
            echo 'No diagnostic output was exported.'
          fi
          echo "inner_exit_code=${INNER_EXIT_CODE:-missing}"
          test "${INNER_EXIT_CODE:-99}" -eq 0
