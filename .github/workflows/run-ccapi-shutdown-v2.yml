name: Run coordinated CCAPI shutdown v2 implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/implement-ccapi-shutdown-v2.yml'
      - '.github/workflows/run-ccapi-shutdown-v2.yml'
      - 'ccapi-shutdown-v2.trigger'

permissions:
  contents: write

concurrency:
  group: run-ccapi-shutdown-v2
  cancel-in-progress: true

jobs:
  run-versioned-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout technical head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Extract and execute reviewed implementation block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/implement-ccapi-shutdown-v2.yml').read_text())
          steps = workflow['jobs']['implement-test-publish']['steps']
          block = next(step['run'] for step in steps
                       if step.get('name') == 'Implement and verify shutdown lifecycle')
          Path('/tmp/implement-ccapi-shutdown-v2.sh').write_text(block)
          PY

          set +e
          bash /tmp/implement-ccapi-shutdown-v2.sh 2>&1 | tee /tmp/shutdown-v2-outer.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$GITHUB_WORKSPACE/runner-diagnostics"
          cp /tmp/shutdown-v2-outer.log \
             "$GITHUB_WORKSPACE/runner-diagnostics/shutdown-v2-outer.log"
          grep -E '\[ERROR\]|COMPILATION|BUILD FAILURE|Failures:|Errors:|cannot find symbol|AssertionFailedError|Traceback|expected exactly one anchor|mismatch|fatal:' \
            /tmp/shutdown-v2-outer.log | tail -n 240 \
            > "$GITHUB_WORKSPACE/runner-diagnostics/shutdown-v2-outer-diagnostics.txt" || true
          printf 'exit_code=%s\n' "$status" \
            > "$GITHUB_WORKSPACE/runner-diagnostics/status.txt"
          exit "$status"

      - name: Upload complete execution diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccapi-shutdown-v2-runner-log
          path: runner-diagnostics/
          if-no-files-found: error
          retention-days: 7
