name: Run coordinated CCAPI shutdown v2 implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/implement-ccapi-shutdown-v2.yml'
      - '.github/workflows/run-ccapi-shutdown-v2.yml'
      - 'ccapi-shutdown-v2.trigger'

permissions:
  contents: write

concurrency:
  group: run-ccapi-shutdown-v2
  cancel-in-progress: true

jobs:
  run-versioned-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout technical head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Execute reviewed implementation and retain status
        id: implementation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/implement-ccapi-shutdown-v2.yml').read_text())
          steps = workflow['jobs']['implement-test-publish']['steps']
          block = next(step['run'] for step in steps
                       if step.get('name') == 'Implement and verify shutdown lifecycle')
          Path('/tmp/implement-ccapi-shutdown-v2.sh').write_text(block)
          PY

          if bash /tmp/implement-ccapi-shutdown-v2.sh \
              > /tmp/shutdown-v2-outer.log 2>&1; then
            status=0
          else
            status=$?
          fi
          mkdir -p "$GITHUB_WORKSPACE/runner-diagnostics"
          printf '%s\n' "$status" \
            > "$GITHUB_WORKSPACE/runner-diagnostics/exit-code"
          cp /tmp/shutdown-v2-outer.log \
            "$GITHUB_WORKSPACE/runner-diagnostics/shutdown-v2-outer.log"
          tail -n 100 /tmp/shutdown-v2-outer.log \
            > "$GITHUB_WORKSPACE/runner-diagnostics/failure-tail.log"
          cat "$GITHUB_WORKSPACE/runner-diagnostics/failure-tail.log"
          exit 0

      - name: Upload complete execution diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccapi-shutdown-v2-runner-log
          path: runner-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Fail when implementation or verification failed
        if: always()
        shell: bash
        run: |
          if [ ! -f runner-diagnostics/exit-code ]; then
            echo 'Shutdown runner did not produce an exit code' >&2
            exit 99
          fi
          status=$(cat runner-diagnostics/exit-code)
          if [ "$status" -ne 0 ]; then
            echo "Coordinated shutdown implementation failed with exit code $status" >&2
            exit "$status"
          fi
