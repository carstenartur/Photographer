name: Run coordinated CCAPI shutdown v2 implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/implement-ccapi-shutdown-v2.yml'
      - '.github/workflows/run-ccapi-shutdown-v2.yml'
      - 'ccapi-shutdown-v2.trigger'

permissions:
  contents: write

concurrency:
  group: run-ccapi-shutdown-v2
  cancel-in-progress: true

jobs:
  run-versioned-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      inner-exit-code: ${{ steps.implementation.outputs.inner-exit-code }}
      diagnostic-base64: ${{ steps.implementation.outputs.diagnostic-base64 }}
    steps:
      - name: Checkout technical head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Execute reviewed implementation and retain status
        id: implementation
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/implement-ccapi-shutdown-v2.yml').read_text())
          steps = workflow['jobs']['implement-test-publish']['steps']
          block = next(step['run'] for step in steps
                       if step.get('name') == 'Implement and verify shutdown lifecycle')
          Path('/tmp/implement-ccapi-shutdown-v2.sh').write_text(block)
          PY

          git fetch origin \
            +refs/heads/hardening/ccapi-coordinated-shutdown-v2:refs/remotes/origin/hardening/ccapi-coordinated-shutdown-v2 \
            +refs/heads/automation/implement-ccapi-shutdown-v2:refs/remotes/origin/automation/implement-ccapi-shutdown-v2

          if bash /tmp/implement-ccapi-shutdown-v2.sh \
              > /tmp/shutdown-v2-outer.log 2>&1; then
            status=0
          else
            status=$?
          fi
          tail -n 80 /tmp/shutdown-v2-outer.log > /tmp/shutdown-v2-tail.log
          echo "inner-exit-code=$status" >> "$GITHUB_OUTPUT"
          echo "diagnostic-base64=$(base64 -w0 /tmp/shutdown-v2-tail.log)" >> "$GITHUB_OUTPUT"
          exit 0

  report-diagnostics:
    if: always()
    needs: run-versioned-implementation
    runs-on: ubuntu-latest
    steps:
      - name: Print focused shutdown diagnostic and evaluate status
        shell: bash
        env:
          DIAGNOSTIC_BASE64: ${{ needs.run-versioned-implementation.outputs.diagnostic-base64 }}
          INNER_EXIT_CODE: ${{ needs.run-versioned-implementation.outputs.inner-exit-code }}
        run: |
          echo '--- coordinated shutdown focused diagnostic ---'
          if [ -n "$DIAGNOSTIC_BASE64" ]; then
            printf '%s' "$DIAGNOSTIC_BASE64" | base64 -d
          else
            echo 'No diagnostic output was exported.'
          fi
          echo "inner_exit_code=${INNER_EXIT_CODE:-missing}"
          test "${INNER_EXIT_CODE:-99}" -eq 0
