name: Run coordinated CCAPI shutdown v2 implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/run-ccapi-shutdown-v2.yml'
      - 'scripts/harden_ccapi_shutdown_v2.py'
      - 'ccapi-shutdown-v2.trigger'

permissions:
  contents: write

concurrency:
  group: run-ccapi-shutdown-v2
  cancel-in-progress: true

jobs:
  harden-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout technical head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Apply reviewed shutdown hardening
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/shutdown-hardening-diagnostics
          {
            set -e
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            cp scripts/harden_ccapi_shutdown_v2.py /tmp/harden_ccapi_shutdown_v2.py
            python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/harden_ccapi_shutdown_v2.py')
          source = path.read_text()
          helper = '''

          def replace_method(path_name: str, signature: str, next_signature: str, replacement: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              start = text.index(signature)
              end = text.index(next_signature, start)
              path.write_text(text[:start] + replacement + "\\n\\n" + text[end:])
          '''
          source = source[:source.index('\n\nPath(')] + helper + source[source.index('\n\nPath('):]

          def replace_chunk(start_marker: str, end_marker: str, replacement: str) -> None:
              global source
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              source = source[:start] + replacement + source[end:]

          replace_chunk(
              'replace_once(\n    stacking,\n    """    private void ensureCameraServiceOpen()',
              '\n\nmanager =',
              '''replace_method(
              stacking,
              "    private void ensureCameraServiceOpen() {",
              "    public StackingJob getJob",
              """    private void ensureCameraServiceOpen() {
                  if (shutdownRequested.get()) {
                      throw new CameraServiceUnavailableException();
                  }
              }""",
          )''')
          replace_chunk(
              'hdr = "session-core/src/main/java/com/photographer/focusstack/session/HdrTimelapseService.java"',
              '\nface =',
              '''hdr = "session-core/src/main/java/com/photographer/focusstack/session/HdrTimelapseService.java"
          replace_method(
              hdr,
              "    private void ensureCameraServiceOpen() {",
              "    public void stopSession",
              """    private void ensureCameraServiceOpen() {
                  if (shutdownRequested.get()) {
                      throw new SessionUnavailableException();
                  }
              }""",
          )
          ''')
          replace_chunk(
              'face = "session-core/src/main/java/com/photographer/focusstack/session/FaceOrbitService.java"',
              '\nastro =',
              '''face = "session-core/src/main/java/com/photographer/focusstack/session/FaceOrbitService.java"
          replace_method(
              face,
              "    private void ensureCameraServiceOpen() {",
              "    public void stopSession",
              """    private void ensureCameraServiceOpen() {
                  if (shutdownRequested.get()) {
                      throw new SessionUnavailableException();
                  }
              }""",
          )
          ''')
          astro_start = source.index('astro = "app/src/main/java/com/photographer/focusstack/astro/service/AstroModeService.java"')
          astro_replace = source.index('replace_once(', astro_start)
          astro_ensure = source.index('replace_once(', astro_replace + 1)
          astro_end = source.index('\n\nhandler =', astro_ensure)
          source = source[:astro_ensure] + '''replace_method(
              astro,
              "    private void ensureCameraServiceOpen() {",
              "    public void requestAbort",
              """    private void ensureCameraServiceOpen() {
                  if (shutdownRequested.get()) {
                      throw new SessionUnavailableException();
                  }
              }""",
          )''' + source[astro_end:]
          path.write_text(source)
          PY
            git fetch origin \
              +refs/heads/hardening/ccapi-coordinated-shutdown-v2:refs/remotes/origin/hardening/ccapi-coordinated-shutdown-v2
            git switch -C shutdown-product origin/hardening/ccapi-coordinated-shutdown-v2
            python /tmp/harden_ccapi_shutdown_v2.py

            mvn -B --no-transfer-progress test \
              -pl app -am \
              -Dtest=InMemoryCameraSessionLeaseManagerTest,CameraSessionShutdownCoordinatorTest,StackingJobLeaseIntegrationTest,GlobalExceptionHandlerShutdownTest,HdrTimelapseLeaseLifecycleTest,FaceOrbitLeaseLifecycleTest,AstroModeServiceLeaseLifecycleTest \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Djava.awt.headless=true
            mvn -B --no-transfer-progress test -pl app -am -Djava.awt.headless=true

            git add app/src/main/java/com/photographer/focusstack/camera/exception/CameraServiceUnavailableException.java \
                    session-core/src/main/java/com/photographer/focusstack/session/SessionUnavailableException.java \
                    app/src/main/java/com/photographer/focusstack/camera/service/StackingJobService.java \
                    app/src/main/java/com/photographer/focusstack/camera/session/InMemoryCameraSessionLeaseManager.java \
                    app/src/main/java/com/photographer/focusstack/astro/service/AstroModeService.java \
                    session-core/src/main/java/com/photographer/focusstack/session/HdrTimelapseService.java \
                    session-core/src/main/java/com/photographer/focusstack/session/FaceOrbitService.java \
                    app/src/main/java/com/photographer/focusstack/app/web/exception/GlobalExceptionHandler.java \
                    app/src/test/java/com/photographer/focusstack/camera/session/InMemoryCameraSessionLeaseManagerTest.java \
                    app/src/test/java/com/photographer/focusstack/camera/service/StackingJobLeaseIntegrationTest.java \
                    app/src/test/java/com/photographer/focusstack/app/web/exception/GlobalExceptionHandlerShutdownTest.java
            git commit -m 'fix(ccapi): persist queued shutdown and expose fixed 503'
            git push origin HEAD:hardening/ccapi-coordinated-shutdown-v2
          } 2>&1 | tee target/shutdown-hardening-diagnostics/full.log

      - name: Upload shutdown hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccapi-shutdown-hardening-diagnostics
          path: target/shutdown-hardening-diagnostics
          if-no-files-found: error
          retention-days: 14
