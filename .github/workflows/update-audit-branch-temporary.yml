name: Update audit follow-up branch (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  merge-main:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/public-release-audit-review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/public-release-audit-review
          fetch-depth: 0

      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/update-audit-branch-temporary.yml
          git commit -m "Merge current main into public-release audit follow-up"
          git push origin HEAD:fix/public-release-audit-review
