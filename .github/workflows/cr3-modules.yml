name: CR3 Modules

on:
  push:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-cli/**'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-cli/**'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-compile:
    name: CR3 compile and unit tests
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: '-Xmx2g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Compile CR3 test sources and run unit tests
        run: >-
          mvn -B --no-transfer-progress clean test
          -pl canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-reference-testkit,canon-cr3-imageio,canon-cr3-cli
          -am
          -Djava.awt.headless=true

      - name: Publish CR3 unit-test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 Unit Tests
          path: 'canon-cr3-*/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'
