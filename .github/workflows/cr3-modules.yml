name: CR3 Modules

on:
  push:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-research/**'
      - 'canon-cr3-maven-smoke/**'
      - 'canon-cr3-cli/**'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-reference-testkit/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-research/**'
      - 'canon-cr3-maven-smoke/**'
      - 'canon-cr3-cli/**'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  workflow_dispatch:

concurrency:
  group: cr3-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-consumer:
    name: CR3 external Maven and architecture verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: '-Xmx2g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Stage production artifacts without repeating unit tests
        run: >-
          mvn -B --no-transfer-progress install
          -DskipTests
          -Dinvoker.skip=true
          -pl canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-imageio
          -am
          -Djava.awt.headless=true

      - name: Verify the isolated Maven consumer and compiled boundaries
        run: >-
          mvn -B --no-transfer-progress verify
          -pl canon-cr3-maven-smoke
          -Djava.awt.headless=true

      - name: Publish external-consumer test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 External Consumer Tests
          path: 'canon-cr3-maven-smoke/target/it/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'
