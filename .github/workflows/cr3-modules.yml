name: CR3 Packaged Consumer

on:
  push:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-maven-smoke/**'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-maven-smoke/**'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  workflow_dispatch:

concurrency:
  group: cr3-packaged-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaged-consumer:
    name: CR3 external Maven consumer and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: '-Xmx2g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Stage packaged production artifacts without repeating unit tests
        run: >-
          mvn -B --no-transfer-progress install
          -DskipTests
          -pl canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-imageio
          -am
          -Djava.awt.headless=true

      - name: Verify isolated external Maven consumer
        run: >-
          mvn -B --no-transfer-progress verify
          -pl canon-cr3-maven-smoke
          -Djava.awt.headless=true

      - name: Publish external-consumer test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 External Consumer Tests
          path: 'canon-cr3-maven-smoke/target/it/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Upload Invoker diagnostics on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cr3-maven-smoke-diagnostics
          path: |
            canon-cr3-maven-smoke/target/it/**/build.log
            canon-cr3-maven-smoke/target/it/**/target/runtime-dependencies.txt
            canon-cr3-maven-smoke/target/it/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 3
