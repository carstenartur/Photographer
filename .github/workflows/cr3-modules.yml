name: CR3 Packaged Consumer

on:
  push:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-maven-smoke/**'
      - 'canon-cr3-benchmark/pom.xml'
      - 'astro-core-benchmark/pom.xml'
      - 'canon-cr3-cli/pom.xml'
      - 'canon-cr3-research/pom.xml'
      - 'canon-cr3-reference-testkit/pom.xml'
      - 'app/pom.xml'
      - 'LICENSE'
      - 'docs/cr3/imageio.md'
      - 'docs/cr3/import.md'
      - 'release/canon-cr3-public/**'
      - 'release/canon-cr3-consumer/**'
      - 'scripts/cr3_repository.py'
      - 'scripts/test_cr3_repository.py'
      - 'scripts/validate_cr3_central_bundle.py'
      - 'scripts/test_validate_cr3_central_bundle.py'
      - 'scripts/validate_cr3_source_coordinates.py'
      - 'scripts/test_validate_cr3_source_coordinates.py'
      - 'scripts/run_cr3_central_preflight.sh'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'canon-cr3-container/**'
      - 'canon-cr3-metadata/**'
      - 'canon-cr3-codec/**'
      - 'canon-cr3-processing/**'
      - 'canon-cr3-core/**'
      - 'canon-cr3-imageio/**'
      - 'canon-cr3-maven-smoke/**'
      - 'canon-cr3-benchmark/pom.xml'
      - 'astro-core-benchmark/pom.xml'
      - 'canon-cr3-cli/pom.xml'
      - 'canon-cr3-research/pom.xml'
      - 'canon-cr3-reference-testkit/pom.xml'
      - 'app/pom.xml'
      - 'LICENSE'
      - 'docs/cr3/imageio.md'
      - 'docs/cr3/import.md'
      - 'release/canon-cr3-public/**'
      - 'release/canon-cr3-consumer/**'
      - 'scripts/cr3_repository.py'
      - 'scripts/test_cr3_repository.py'
      - 'scripts/validate_cr3_central_bundle.py'
      - 'scripts/test_validate_cr3_central_bundle.py'
      - 'scripts/validate_cr3_source_coordinates.py'
      - 'scripts/test_validate_cr3_source_coordinates.py'
      - 'scripts/run_cr3_central_preflight.sh'
      - 'pom.xml'
      - '.github/workflows/cr3-modules.yml'
  workflow_dispatch:

concurrency:
  group: cr3-packaged-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaged-consumer:
    name: CR3 external Maven consumer and Central bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_OPTS: '-Xmx4g'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Resolve the CR3 release candidate version
        run: |
          revision=$(mvn -B -ntp -N -q help:evaluate \
            -Dexpression=revision -DforceStdout -Dstyle.color=never)
          version=${revision%-SNAPSHOT}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected an X.Y.Z release candidate, found Maven revision '$revision'" >&2
            exit 1
          }
          printf 'CR3_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Verify the independent Git-backed Maven release and consumer
        run: |
          python3 scripts/test_cr3_repository.py
          python3 scripts/cr3_repository.py "$CR3_RELEASE_VERSION"

      - name: Build and validate signed public Central bundle
        run: bash scripts/run_cr3_central_preflight.sh "$CR3_RELEASE_VERSION"

      - name: Upload credential-free Central bundle
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canon-cr3-central-preflight
          path: target/cr3-central-preflight/
          if-no-files-found: warn
          retention-days: 7

      - name: Stage packaged production artifacts without repeating unit tests
        run: >-
          mvn -B --no-transfer-progress install
          -DskipTests
          -pl canon-cr3-container,canon-cr3-metadata,canon-cr3-codec,canon-cr3-processing,canon-cr3-core,canon-cr3-imageio
          -am
          -Djava.awt.headless=true

      - name: Set up the minimum CR3 runtime (JDK 21)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Verify isolated external Maven consumer on JDK 21
        run: >-
          mvn -B --no-transfer-progress verify
          -pl canon-cr3-maven-smoke
          -Djava.awt.headless=true

      - name: Publish external-consumer test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CR3 External Consumer Tests
          path: 'canon-cr3-maven-smoke/target/it/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Upload Invoker diagnostics on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cr3-maven-smoke-diagnostics
          path: |
            canon-cr3-maven-smoke/target/it/**/build.log
            canon-cr3-maven-smoke/target/it/**/target/runtime-dependencies.txt
            canon-cr3-maven-smoke/target/it/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
